# A redacao da PMSC 2026: o que a banca cobra, o metodo, os temas e o pedido
# de correcao para a IA. Lido pela aba Redacao do radar PMSC (Etapa 3 do
# PEDIDO_PMSC.md). E DADO: pode editar a mao.
#
# PROCEDENCIA: escrito pelo Claude (claude-opus-5-5) em 23/10/2026, a partir do
# item 11 do Edital 002/CCP/2026 - CFP (Instituto AOCP) e das provas de redacao
# da AOCP para a PM-GO (2022) e a PM-ES (2022).

regras_do_edital:
  tema: "Ordem Pública: sistema de justiça criminal; políticas públicas de ordem pública e cidadania; a ordem pública na CF/88 - competências das PMs, a PM como força auxiliar e reserva do Exército, a PM organizada com base na hierarquia e disciplina."
  tipo: dissertativo-argumentativo
  linhas_minimo: 20
  linhas_maximo: 30
  nota_maxima: 20
  nota_minima: 10
  # Quem passa da 2.000a posicao na objetiva nao tem a redacao corrigida.
  corrigida_ate_a_posicao: 2000
  formula: "NPR = NC - (NE / TL): NC é a nota de conteúdo (0 a 20), NE o número de erros de português e TL o total de linhas escritas. Cada linha abaixo de 20 tira 0,20."
  criterios_de_conteudo:
    - Atendimento e desenvolvimento do tema
    - Coesão e coerência
    - Atendimento à estrutura dissertativo-argumentativa
    - Informatividade e argumentação
  zero:
    - Fugir do tema
    - Não ser dissertativo-argumentativo
    - Letra ilegível
    - Escrever a lápis ou com tinta que não seja azul ou preta
    - Qualquer marca que identifique o candidato (nome, assinatura, rubrica)
    - Folha definitiva em branco

esqueleto:
  - parte: Introdução
    linhas: "4 a 5"
    o_que_escrever: "Contexto (a lei ou o fato) + o problema do tema + a TESE com os dois argumentos."
    modelo: "A Constituição Federal de 1988, em seu artigo 144, estabelece que a segurança pública é dever do Estado, direito e responsabilidade de todos. Nesse contexto, [o tema] depende de [argumento 1] e de [argumento 2]."
  - parte: Desenvolvimento 1
    linhas: "7 a 8"
    o_que_escrever: "Tópico frasal (o argumento 1 em uma frase) + fundamentação (por que é verdade) + exemplo concreto + fecho ligando à tese."
    modelo: "Em primeiro lugar, [argumento 1]. Isso ocorre porque [fundamentação]. Um exemplo disso é [exemplo]. Dessa forma, [ligação com a tese]."
  - parte: Desenvolvimento 2
    linhas: "7 a 8"
    o_que_escrever: "O mesmo desenho, com o argumento 2."
    modelo: "Além disso, [argumento 2]. [Fundamentação]. [Exemplo]. Assim, [ligação com a tese]."
  - parte: Conclusão
    linhas: "4 a 5"
    o_que_escrever: "Retome a tese com outras palavras + proposta com AGENTE, AÇÃO, MEIO e FINALIDADE."
    modelo: "Portanto, [tese com outras palavras]. Para isso, cabe ao [agente] [ação], por meio de [meio], a fim de [finalidade]."

roteiro_de_ideias:
  minutos: 10
  passos:
    - "Reescreva o tema com as suas palavras e sublinhe a palavra-chave."
    - "Responda: O QUE é isso? POR QUE importa (para a sociedade e para a PM)? COMO melhorar?"
    - "Escolha 2 argumentos entre as 4 fontes: a lei; o papel da PM; a consequência de não fazer; a solução."
    - "Escreva a tese em UMA frase. Só então comece o texto."

conectivos:
  abrir: [Em primeiro lugar, Inicialmente, Além disso, Ademais, Por outro lado]
  explicar: [Isso ocorre porque, Visto que, Uma vez que]
  exemplificar: [Um exemplo disso é, É o caso de]
  fechar: [Dessa forma, Assim, Portanto, Diante disso]

erros_que_mais_tiram_ponto:
  - "Vírgula entre sujeito e verbo."
  - "Crase antes de palavra masculina ou de verbo."
  - "\"Haviam problemas\" (o certo é \"havia\": haver no sentido de existir não vai ao plural)."
  - "\"Onde\" para o que não é lugar (use \"em que\", \"no qual\")."
  - "mas x mais; a x há; mal x mau; porque x por que."
  - "Acento: \"têm\" no plural, \"veem\" sem acento."
  - "Escrever em primeira pessoa (\"eu acho\")."
  - "Menos de 20 linhas."

# So o que e certo. Numero inventado vira erro de conteudo: a IA nunca deve
# sugerir estatistica que nao esteja aqui.
repertorio:
  - "CF art. 144, caput: a segurança pública é dever do Estado, direito e responsabilidade de todos, exercida para a preservação da ordem pública e da incolumidade das pessoas e do patrimônio."
  - "CF art. 144, § 5º: às polícias militares cabem a polícia ostensiva e a preservação da ordem pública."
  - "CF art. 144, § 6º: as polícias militares são forças auxiliares e reserva do Exército e se subordinam aos Governadores."
  - "CF art. 42: os militares dos Estados integram instituições organizadas com base na hierarquia e na disciplina."
  - "Lei 13.675/2018: institui o Sistema Único de Segurança Pública (SUSP), que integra os órgãos de segurança."
  - "Lei 14.751/2023: Lei Orgânica Nacional das Polícias Militares e dos Corpos de Bombeiros Militares."
  - "Lei 11.340/2006 (Maria da Penha): proteção à mulher em situação de violência doméstica."
  - "O sistema de justiça criminal: polícia, Ministério Público, Judiciário e execução penal - a PM é a porta de entrada."
  - "Policiamento comunitário e prevenção: a polícia próxima da comunidade recebe mais informação e mais confiança."
  - "Direitos humanos na atuação policial: o uso da força é legal quando necessário e proporcional."

