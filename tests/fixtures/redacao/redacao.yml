# Temas que a propria AOCP ja deu em PM, para ver o formato da proposta. Os
# dois sao de 2022 e NAO sao de ordem publica: o edital da PMSC restringe.
temas_anteriores_da_aocp:
  - {prova: "PM-GO 2022, Soldado", tema: "O tempo utilizado na internet é prejudicial para as pessoas ou é uma necessidade do mundo contemporâneo?", linhas: "20 a 30", link: "https://cdn.direcaoconcursos.com.br/uploads/2023/03/Prova-discursiva_PMGO.pdf"}
  - {prova: "PM-ES 2022, Soldado Combatente", tema: "A importância da valorização da saúde mental no ambiente de trabalho", linhas: "15 a 30", link: "https://cdn.direcaoconcursos.com.br/uploads/2023/03/Prova-discursiva_PM-ES.pdf"}

# O pedido que vai para a IA na correcao. A resposta volta em JSON, com
# procedencia (modelo e data), e e gravada em data/redacoes.json.
pedido_de_correcao: |
  Você é um corretor (examinador) da banca Instituto AOCP. Corrija a redação abaixo para o concurso de Soldado da PMSC 2026, exatamente pelos critérios do edital (item 11.5), como na correção oficial.
  NOTA DE CONTEÚDO (NC, de 0 a 20), pelos quatro critérios: (1) atendimento ao tema e seu desenvolvimento (informatividade e argumentação); (2) coesão intra e entre parágrafos (referencial e sequencial); (3) coerência (progressão, articulação, não contradição); (4) atendimento à estrutura dissertativo-argumentativa (organização do texto e dos parágrafos). Para cada critério: a nota, um comentário curto, o que está bom (positivos) e o que melhorar (negativos).
  ERROS DE PORTUGUÊS (o NE): cada erro de ortografia, acentuação, crase, concordância, regência, pontuação ou morfossintaxe, um por ocorrência, com o trecho EXATAMENTE como está no texto (o radar o marca no lugar), a correção, a regra, o tipo e uma explicação em linguagem simples, para quem não estuda gramática há anos.
  MELHORIAS: o "você escreveu, como fica, por quê" do que não é erro de português mas tira nota de conteúdo: repetição, conectivo fraco ou errado, frase longa demais, argumento vago, exemplo genérico, proposta sem agente, ação, meio ou finalidade.
  Dê também: de 2 a 4 PONTOS POSITIVOS gerais; os 3 PONTOS que mais tiraram nota; 3 FOCOS para a próxima redação; e o PARÁGRAFO MAIS FRACO reescrito como o corretor o escreveria.
  Quando o texto vier da foto da folha (origem "foto"), avalie a LEGIBILIDADE da letra: "legível", "com trechos difíceis" ou "ilegível", e o que observar. Letra ilegível é nota zero (edital, 11.13).
  Os TEXTOS MOTIVADORES da proposta vão no pedido: trecho copiado deles não é argumento do candidato e não conta como informatividade.
  MOTIVO DE ZERO, se houver (edital, 11.13): fuga ao tema, texto que não é dissertativo-argumentativo, letra ilegível, identificação do candidato.
  Regras do edital: 20 a 30 linhas; NPR = NC - NE / TL, menos 0,20 por linha abaixo de 20. A conta é do radar: a sua nota_final serve só para comparar.
  Seja rigoroso e realista como um corretor de banca: não dê nota maior para agradar e não elogie à toa, mas diga o que está bom. Nunca invente estatística, número ou lei: se sugerir repertório, use só a lista "repertorio" enviada junto ou os textos motivadores.

pedido_de_reescrita: |
  Você é o mesmo corretor da banca Instituto AOCP. O candidato recebeu a correção da redação e reescreveu à mão o parágrafo mais fraco (campo "reescrita"). Compare com o parágrafo original (na "redacao"), com o que a correção apontou ("o_que_a_correcao_disse") e com o modelo do corretor ("paragrafo_reescrito_pelo_corretor").
  Diga se melhorou ("sim", "em parte" ou "não"); num comentário direto, o que ficou melhor e o que não ficou; o que ainda falta; e os erros de português da reescrita (trecho, correção, regra). Não reescreva de novo: o objetivo é ele aprender a fazer. Se ele só copiou o modelo do corretor, diga isso.

pedido_de_ideias: |
  Para o tema abaixo, dê: 3 teses possíveis (uma frase cada); para cada tese, 2 argumentos com uma frase de fundamentação; 1 exemplo concreto do dia a dia do policiamento para cada argumento (sem números inventados); e 1 proposta de intervenção com agente, ação, meio e finalidade. Use só o repertório enviado junto. Devolva em JSON.
