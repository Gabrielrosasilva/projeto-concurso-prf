# O link do Qconcursos de cada tema do cronograma da PMSC (decisao 140).
#
# O Qconcursos nao tem API e os termos dele proibem robo: o radar NUNCA consulta
# o site. Os numeros abaixo sairam das listas de assuntos que o Gabriel copiou
# do site em 24/10/2026 (F12 > Elements > <ul class="q-options">), guardadas em
# pmsc/qconcursos/, e o radar so monta o endereco. O nome ao lado do numero e o
# do site (com os espacos repetidos juntados), para conferir; quem vale e o
# numero.
#
# Para corrigir um tema: troque os numeros e o nome (copiados da lista do site,
# nunca de cabeca). O tema e reconhecido pelo titulo da faixa sem o prefixo
# ("Fixação: ", "Aprendizagem: ", "R+7: "...), sem acento e sem caixa, como a
# ficha. Um tema tem uma disciplina so: o radar monta um filtro por disciplina.
# Tema que nao esta aqui continua com o filtro escrito do plano.
#
# `aviso`: quando o assunto do site e mais largo que o tema (ou falta parte do
# tema no site), a faixa diz o que pular - o link traz mais do que voce
# estudou, e isso nao pode medir calado.
#
# O assunto-pai (ex.: "13 Crase") entra quando todos os filhos dele sao do tema
# (nao se sabe se o site traz os filhos pelo pai). As tres excecoes - "11
# Seguranca da Informacao", "12 Navegadores" e "14 Medidas Socioeducativas" -
# entram pelo generico, e o aviso diz qual filho pular.
#
# As revisoes e as baterias de uma disciplina so juntam todos os assuntos do
# site que o edital cobra.
#
# Sem assunto no site (ficam sem link, com o filtro escrito do plano):
#   Legislacao Institucional - nenhuma lei da PMSC tem disciplina no site, nem
#   a Lei 14.751/2023:
#     Estatuto da PMSC 1: generalidades, hierarquia e disciplina (Lei 6.218/83)
#     Estatuto da PMSC 2: obrigações, deveres e violação dos deveres (Lei 6.218/83)
#     Estatuto da PMSC 3: direitos, prerrogativas e situações especiais (Lei 6.218/83)
#     Estatuto da PMSC 4: exclusão do serviço ativo e tempo de serviço (Lei 6.218/83)
#     Lei Orgânica Nacional das PMs e CBMs 1 (Lei 14.751/2023)
#     Lei Orgânica Nacional das PMs e CBMs 2 (Lei 14.751/2023)
#     Processo Administrativo Disciplinar na PMSC (Portaria 009/2001)
#     Ingresso nas carreiras militares de SC (LC 587/2013)
#     Conselho de Disciplina da PMSC (Lei 5.209/76)
#     Promoção das praças (LC 801/2022)
#     Regime remuneratório especial: o subsídio (LC 765/2020)
#     Organização Básica da PMSC (Decreto 1.601/2021)
#     Revisão final 1: as 8 leis institucionais
#     Questões: as 8 leis institucionais
#   Sem a lei no site - o 40.x do Direito Penal nao tem a Lei 9.605/98:
#     Novo no edital: Crimes ambientais (Lei 9.605/98)
#   Misturam disciplinas do site:
#     Questões: Legislação Especial (todas as leis)   (Penal, Processo Penal, ECA e Idoso)
#     Questões: Penal, Processo Penal e Legislação Especial
#     Revisão final 5: Penal, Processo Penal e Legislação Especial pelo caderno de erros
#     Português e Informática: revisão final
#     Mini simulado: 30 questões de tudo

# Instituto AOCP (o numero do filtro Banca do site).
banca: 379

# Os numeros das disciplinas no site, para ler os temas (o do Portugues nao
# vinha no endereco da lista copiada: e o 1 de sempre). As leis penais
# especiais ficam no Direito Penal do site (40.x), menos a organizacao
# criminosa e a interceptacao telefonica, que ficam no Processo Penal (27 e
# 25); o ECA e o Estatuto da Pessoa Idosa tem disciplina propria. O Processo
# Penal Militar (204) e a Legislacao da Justica Militar (556) tambem foram
# copiados, mas nao sao do edital da PMSC: ficam fora.
disciplinas:
  Português: 1
  Direito Constitucional: 3
  Direito Penal: 9
  Direito Processual Penal: 10
  Noções de Informática: 46
  Legislação de Trânsito: 200
