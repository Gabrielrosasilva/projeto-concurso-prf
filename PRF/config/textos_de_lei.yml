# O texto oficial de cada no, que vai no pedido de geracao (decisao PMSC-8; na
# PRF, PRF-40).
#
# O pedido de gerar questoes (`radar gerar --pedido`, e o `--certo-errado` por
# aula) de um no desta lista leva o texto da lei - so os artigos do no, quando
# o nome dele tem o intervalo ("arts. 161 a 190") -, para a IA escrever pelo
# texto vigente e citar o artigo dele. `conteudo` e o caminho do no; vale o item
# mais especifico (e, se ele se repete, todos os itens dele: PRF-41). `arquivo` e
# a copia local, relativa a pasta do projeto (leis/ nao vai para o git); `url` e
# o endereco oficial. `artigos` (opcional) e o trecho ("arts. 76 a 91", ou "a lei
# inteira"), e vale antes do intervalo do nome do no.
#
# Resolucoes do CONTRAN: o edital de 2021 cita resolucoes que hoje estao
# revogadas. O no aponta para o texto VIGENTE que as substituiu, junto com as
# que o alteraram (docs/resolucoes_contran.md), num .txt so em leis/contran/
# (o PDF do gov.br passado pelo pdftotext; os links em leis/contran/manifesto.json).

