# O no da arvore de cada assunto do Qconcursos (decisao PMSC-26).
#
# As questoes que o script do Gabriel tirou do site sairam dos links das faixas
# do cronograma, e cada link e um assunto do site. A primeira leitura e este
# mapa: o assunto do site -> o no mais fundo que o cobre. A segunda, as cegas,
# leu uma amostra de ate 2 questoes por assunto, so com o texto e a arvore; as
# discordancias tiveram uma terceira leitura que desempatou.
#
# `amostra`: passou (a amostra bateu: as questoes do assunto vem conferidas),
# contradito (vira pendente: nao treina ate o Gabriel conferir) ou sem
# confirmacao (a amostra nao disse nada: o no do mapa vale, sem conferencia).
# `questoes`: a questao da amostra que nao segue o no do assunto.
#
# Os 504 assuntos novos (Processo Penal, ECA, Estatuto da Pessoa Idosa, Penal
# Militar, Transito, Informatica, Portugues e o que faltava de Penal e de
# Constitucional) entraram em 03/11 (decisao PMSC-28), pela mesma regra, com a
# `procedencia` de cada um: a do topo e a do primeiro lote. Neles, a questao da
# amostra cujas duas leituras bateram tambem esta em `questoes`, conferida.
#
# A chave e `caminho`, e nao `no`: no YAML, `no` vira o booleano falso.
#
# Para corrigir: troque o `caminho` (um caminho que existe em data/conteudos.json)
# e rode `radar questoes-do-qconcursos --classificar`.

procedencia: "o link da faixa do Qconcursos: mapa do assunto do site pelo Claude Code (claude-opus-5-5), PMSC-26, em 02/11/2026"

