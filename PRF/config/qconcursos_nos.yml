    por_que: "O CP art. 14 define consumado e tentado; preferido a 'Tentativa e crime impossível' (mais largo) e ao irmão 'Iter criminis e consumação', que cobre só parte."
  "9:16686":
    nome: "3.12 Desistência voluntária e arrependimento eficaz"
    caminho: "Direito Penal > Tipicidade, ilicitude, culpabilidade, punibilidade > Tentativa e crime impossível > CP, art. 15"
    amostra: "passou"
    por_que: "O CP art. 15 é exatamente desistência voluntária e arrependimento eficaz; mais específico que o nó temático que junta o arrependimento posterior."
