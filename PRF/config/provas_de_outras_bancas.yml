# --- As provas da AOCP que o Gabriel salvou em 24/10 a noite (PMSC-17) ------
# Preparadas e ensaiadas em memoria pelo Claude Code em 24/10; os links de
# onde vieram, o Gabriel mandou no mesmo dia (PMSC-20).
# --- Policia Penal DF 2022: so para conferir o assunto (Certo/Errado, PMSC-19)
# O caderno tem 150 itens de CERTO ou ERRADO e e escaneado (o texto embutido e
# de OCR: o numero do item 9 e do 77 se perdeu, e o 143 saiu como 148). O
# Claude Code transcreveu em 24/10, olhando a imagem de cada pagina, os 68
# itens das materias da PMSC para o `arquivo_transcrito` (JSON em
# data\provas\manual\, fora do git: o texto e de terceiros, decisao 132), com
# o gabarito POS-RECURSOS do bloco "POLICIA PENAL - PROVA 01" (o 15 anulado).
# Certo/Errado nunca mede nem treina como a multipla escolha (decisao 166): a
# prova fica RECUSADA no acervo complementar (`complementar.CERTO_ERRADO`) e
# so aparece na tela "Certo ou Errado" do tema, sem gravar resposta.
