    onde: radar
    titulo: 'Simulado da semana: 60 itens'
    detalhe: '40 itens dos temas desta semana e 20 das anteriores, só das matérias do Ciclo 1, misturados, sem consulta
      e cronometrado. Treina, não mede: não entra na comparação. Às 14h se puder.'
  - tipo: portugues
    duracao: 60
    cronometrado: true
    materia: Redação
    titulo: 'Redação da semana: Os crimes de trânsito, a Lei Seca e os sinistros nas rodovias'
    detalhe: 'É o tema da discursiva da PRF de 2021, com outras palavras: a proposta, os textos motivadores e os
      três aspectos estão na aba Redação. 10 min de roteiro (um parágrafo para cada aspecto), 40 min escrevendo
      à mão até 30 linhas, 10 min revisando pontuação e acento. Correção: a foto da folha no Claude Code, com "corrige
      a redação" (Cebraspe: NPD = NC - 4 x NE/TL; um conceito de 0 a 3 por aspecto; abaixo de 10 elimina). Depois,
      compare com o padrão de resposta definitivo (o link).'
    link: https://cdn.cebraspe.org.br/concursos/PRF_21/arquivos/PRF_21_PADRAO_DE_RESPOSTA_DEFINITIVO.PDF
  - tipo: correcao
    duracao: 30
    titulo: Correção do sábado
    detalhe: Na Revisão do simulado, passe pelos erros, chutes e em branco com a explicação aberta. A redação vai
      para o Claude Code.
