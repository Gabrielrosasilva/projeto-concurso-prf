      e cronometrado. Treina, não mede: não entra na comparação. Às 14h se puder.'
  - tipo: portugues
    duracao: 60
    cronometrado: true
    materia: Redação
    titulo: 'Redação da semana: O uso do celular ao volante e a segurança nas rodovias federais'
    detalhe: '2ª versão do tema de 16/01: escreva de novo, sem olhar a primeira, usando o que a correção apontou;
      depois compare as duas notas na aba Redação. 10 min de roteiro (um parágrafo para cada aspecto), 40 min escrevendo
      à mão até 30 linhas, 10 min revisando pontuação e acento. Correção: a foto da folha no Claude Code, com "corrige
      a redação" (Cebraspe: NPD = NC - 4 x NE/TL; um conceito de 0 a 3 por aspecto; abaixo de 10 elimina).'
