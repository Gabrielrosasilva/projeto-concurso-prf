    detalhe: 'É tema proposto pelo Claude: a proposta, os textos motivadores e os três aspectos estão na aba Redação.
      10 min de roteiro (um parágrafo para cada aspecto), 40 min escrevendo à mão até 30 linhas, 10 min revisando
      pontuação e acento. Correção: a foto da folha no Claude Code, com "corrige a redação" (Cebraspe: NPD = NC
      - 4 x NE/TL; um conceito de 0 a 3 por aspecto; abaixo de 10 elimina).'
