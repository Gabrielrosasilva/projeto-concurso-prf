- data: '2027-01-09'
  semana: 1
  manha:
  - tipo: diagnostico
    questoes: 120
    min_por_questao: 1.75
    cronometrado: true
    materias_da_rodada:
    - Legislação de Trânsito
    - Língua Portuguesa
    - Língua Estrangeira (Inglês ou Espanhol)
    - Informática
    - Direito Administrativo
    - Direito Constitucional
    - Raciocínio Lógico-Matemático
    - Legislação Especial
    - Ética e Cidadania
    - Física
    - Direito Penal
    - Direito Processual Penal
    - Direitos Humanos
    - Geopolítica
    onde: radar
    titulo: 'Diagnóstico: 120 itens, como a prova'
    detalhe: 'O ponto de partida, sem consulta e sem estudar antes: 120 itens divididos como a prova de 2021, cronometrado
      (3h30, e a redação depois: a prova teve 4h30 para as duas). Deixe em branco o que não souber. As questões
      saem da regra das rodadas que medem (as provas da PRF primeiro, pela incidência); o fechamento da semana 6
      usa a mesma regra, sem repetir questão, para comparar. Faça às 14h se puder: a prova é à tarde.'
  - tipo: portugues
    duracao: 60
    cronometrado: true
    materia: Redação
    titulo: 'Redação da semana: As infrações de trânsito nas rodovias federais: o papel da PRF, da sociedade e do
      indivíduo'
    detalhe: 'É o tema da discursiva da PRF de 2019, com outras palavras: a proposta, os textos motivadores e os
      três aspectos estão na aba Redação. 10 min de roteiro (um parágrafo para cada aspecto), 40 min escrevendo
      à mão até 30 linhas, 10 min revisando pontuação e acento. Correção: a foto da folha no Claude Code, com "corrige
      a redação" (Cebraspe: NPD = NC - 4 x NE/TL; um conceito de 0 a 3 por aspecto; abaixo de 10 elimina). Depois,
      compare com o padrão de resposta definitivo (o link).'
    link: https://cdn.cebraspe.org.br/concursos/PRF_18/arquivos/PRF_18___PADRO_DE_RESPOSTAS_DEFINITIVO.PDF
  - tipo: correcao
    duracao: 30
    titulo: Correção do sábado
    detalhe: Na Revisão do simulado, passe pelos erros, chutes e em branco com a explicação aberta. A redação vai
      para o Claude Code.
