    - Direito Constitucional
    - Direito Administrativo
    - Legislação Especial
    - Direito Penal
    - Direito Processual Penal
    - Direitos Humanos
    onde: radar
    titulo: 'Simulado da semana: 60 itens'
    detalhe: '40 itens dos temas desta semana e 20 das anteriores, só das matérias do Ciclo 1, misturados, sem consulta
      e cronometrado. Treina, não mede: não entra na comparação. Às 14h se puder.'
  - tipo: portugues
    duracao: 60
    cronometrado: true
    materia: Redação
    titulo: 'Redação da semana: A fiscalização eletrônica de velocidade e a redução dos sinistros de trânsito'
    detalhe: 'É tema proposto pelo Claude: a proposta, os textos motivadores e os três aspectos estão na aba Redação.
      10 min de roteiro (um parágrafo para cada aspecto), 40 min escrevendo à mão até 30 linhas, 10 min revisando
      pontuação e acento. Correção: a foto da folha no Claude Code, com "corrige a redação" (Cebraspe: NPD = NC
      - 4 x NE/TL; um conceito de 0 a 3 por aspecto; abaixo de 10 elimina).'
  - tipo: correcao
    duracao: 30
    titulo: Correção do sábado
    detalhe: Na Revisão do simulado, passe pelos erros, chutes e em branco com a explicação aberta. A redação vai
      para o Claude Code.
