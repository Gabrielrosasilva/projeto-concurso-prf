# A redacao da PRF: o que o Cebraspe cobra, o metodo, os temas e o pedido de correcao
# para a IA. Lido pela aba Redacao do radar (o formato e o da copia PMSC, decisao
# PMSC-5). E DADO: pode editar a mao.
#
# PROCEDENCIA: escrito pelo Claude Code (claude-opus-5-5) em 25/11/2026 (PRF-37), a
# partir do item 10 do Edital PRF nº 1, de 18/1/2021 (`docs/edital.md`) e dos padroes
# de resposta definitivos das discursivas de 2019 e 2021 (links em `temas_anteriores`).
# Os textos motivadores e o repertorio sao trechos LITERAIS da lei vigente, da
# compilacao da Camara (copias em fontes/leis/), com "[...]" onde se cortou, conferidos
# palavra por palavra em 25/11/2026. Texto de lei nao tem direito autoral (Lei
# 9.610/1998, art. 8º, IV). O texto das provas (comando e textos motivadores) e de
# terceiros e NAO esta aqui: os temas de 2019 e 2021 vao com outras palavras.
#
# A NOTA (PRF-37, PRF-70): NPD = NC - 4 x (NE / TL), edital 10.6.4. O padrao de
# resposta da a escala de cada quesito (conceito 0 a 3) e o caderno da prova da o
# valor: "ate 1,00 ponto" para a apresentacao e a estrutura textual e o resto nos
# aspectos (2019: 7, 6 e 6; 2021: 5, 5 e 9; o `valores` do tema). NC = nota da
# apresentacao + soma de (valor x conceito / 3). Tema sem `valores`: 19 / 3 cada.
# A conversao do conceito em pontos e do radar (o padrao nao publica a conta).

regras_do_edital:
  cabecalho: "Policial Rodoviário Federal · Cebraspe · texto dissertativo de até 30 linhas · 20 pontos · eliminado abaixo de 10"
  tema: "Temas relacionados aos objetos de avaliação (10.1). Em 2019 e em 2021, os dois foram de trânsito nas rodovias, com três aspectos para abordar."
  tipo: dissertativo
  # Sem minimo de linhas no edital do Cebraspe: so o maximo (10.1). Com 0, nao ha
  # desconto por linha que falta.
  linhas_minimo: 0
  linhas_maximo: 30
  nota_maxima: 20
  nota_minima: 10
  # NPD = NC - 4 x (NE / TL) (10.6.4, d).
  fator_dos_erros: 4
  # A escala de cada quesito nos padroes de resposta de 2019 e 2021.
  conceito_maximo: 3
  # "dos quais ate 1,00 ponto sera atribuido ao quesito apresentacao (legibilidade,
  # respeito as margens e indicacao de paragrafos) e estrutura textual" (os cadernos
  # da discursiva de 2019 e 2021, PRF-70).
  apresentacao_maxima: 1
  corrigida_ate_a_posicao: "6.000"
  formula: "NPD = NC − 4 × (NE ÷ TL) (10.6.4): NC é a nota de conteúdo (apresentação, estrutura textual e desenvolvimento do tema, até 20), NE os erros de grafia, morfossintaxe e propriedade vocabular, e TL as linhas efetivamente escritas. NPD negativa vira zero; abaixo de 10, eliminado."
  item_da_formula: "edital 2021, 10.6.4"
  criterio_da_correcao: "pelo critério do Cebraspe (edital 2021, 10.6.4, e os padrões de resposta da PRF de 2019 e 2021)"
  criterios_de_conteudo:
    - "Apresentação e estrutura textual: até 1 ponto (legibilidade, margens, parágrafos e organização das ideias; caderno da prova)"
    - "Desenvolvimento do tema: os outros 19 pontos, um quesito por aspecto, cada um com conceito de 0 a 3 e o valor do caderno (2019: 7, 6 e 6; 2021: 5, 5 e 9)"
  zero:
    - "Fuga ao tema (10.6.4, g)"
    - "Não haver texto (10.6.4, g)"
    - "NPD abaixo de zero vira zero (10.6.4, e)"
    - "Anulada: folha com marca que identifique o candidato fora do lugar próprio (10.4) ou não devolvida (10.6.5)"
  caneta: "caneta esferográfica de tinta preta, de material transparente (10.3)"
  ilegivel: "o edital pede letra legível (10.3)"
  sem_textos: "Os temas de 2019 e 2021 foram de trânsito nas rodovias, com três aspectos para abordar."
  fonte: "Edital Concurso PRF nº 1, de 18 de janeiro de 2021, item 10 (docs/edital.md)."

esqueleto:
  - parte: Introdução
    linhas: "3 a 5"
    o_que_escrever: "O contexto (um fato, uma situação da rodovia ou, quando for pertinente, a lei) + o tema + anuncie os três aspectos que o texto vai tratar. Varie a abertura: não comece toda redação pela lei."
    modelo: "[Um fato ou uma situação que mostre o problema]. Nesse cenário, [o tema] envolve [aspecto 1], [aspecto 2] e [aspecto 3]."
  - parte: Aspecto 1
    linhas: "6 a 8"
    o_que_escrever: "Responda ao primeiro aspecto: explique (não só cite), dê a causa ou o exemplo e ligue ao tema. É o quesito 2.1."
    modelo: "Em primeiro lugar, [aspecto 1]. Isso ocorre porque [explicação]. Um exemplo é [exemplo]. Dessa forma, [ligação com o tema]."
  - parte: Aspecto 2
    linhas: "6 a 8"
    o_que_escrever: "O mesmo desenho, com o segundo aspecto, e uma ponte com o primeiro. É o quesito 2.2."
    modelo: "Além disso, [aspecto 2], o que se relaciona com [aspecto 1] porque [ponte]. [Explicação]. [Exemplo]."
  - parte: Aspecto 3
    linhas: "6 a 8"
    o_que_escrever: "O terceiro aspecto, com exemplos concretos. Quando o aspecto pede ações, diga quem faz, o que faz e para quê. É o quesito 2.3."
    modelo: "Por fim, [aspecto 3]: cabe a [quem] [ação], por meio de [como], a fim de [para quê]."
  - parte: Conclusão
    linhas: "3 a 4"
    o_que_escrever: "Retome o tema articulando os três aspectos, sem ideia nova."
    modelo: "Portanto, [tema] depende de [aspecto 1], [aspecto 2] e [aspecto 3], que se complementam: [síntese]."

roteiro_de_ideias:
  minutos: 10
  passos:
    - "Leia o comando e numere os aspectos: cada aspecto é um quesito, e cada quesito vira um parágrafo."
    - "Para cada aspecto, responda em uma linha: O QUE é, POR QUE acontece (a causa) e UM EXEMPLO concreto."
    - "Ache a ligação entre os aspectos (o conceito 3 exige articular com o tema e com os outros aspectos)."
    - "Escreva a frase da introdução que anuncia os três aspectos. Só então comece o texto."

conectivos:
  abrir: [Em primeiro lugar, Inicialmente, Além disso, Ademais, Por fim]
  explicar: [Isso ocorre porque, Visto que, Uma vez que, Em razão de]
  exemplificar: [Um exemplo disso é, É o caso de, Como se vê em]
  contrastar: [Entretanto, Contudo, No entanto]
  fechar: [Dessa forma, Assim, Portanto, Diante disso]

erros_que_mais_tiram_ponto:
  - "Citar o aspecto sem explicar: no padrão, mencionar sem desenvolver é conceito 1."
  - "Desenvolver um aspecto solto, sem ligar ao tema e aos outros: é conceito 2."
  - "Esquecer um aspecto: conceito 0 naquele quesito."
  - "Passar de 30 linhas: o que passa é desconsiderado (10.6.4, c)."
  - "Vírgula entre sujeito e verbo."
  - "Crase antes de palavra masculina ou de verbo."
  - "\"Haviam problemas\" (o certo é \"havia\": haver no sentido de existir não vai ao plural)."
  - "\"Onde\" para o que não é lugar (use \"em que\", \"no qual\")."
  - "mas x mais; a x há; mal x mau; porque x por que."
  - "Acento: \"têm\" no plural, \"veem\" sem acento."
  - "Cada erro tira 4 ÷ TL: em 30 linhas, 6 erros tiram 0,80 ponto."

# So o que e certo, conferido no texto da lei. Numero inventado vira erro de
# conteudo: a IA nunca deve sugerir estatistica que nao esteja aqui.
repertorio:
  - "CF, art. 144, caput: a segurança pública, dever do Estado, direito e responsabilidade de todos, é exercida para a preservação da ordem pública e da incolumidade das pessoas e do patrimônio; a polícia rodoviária federal é um dos órgãos (inciso II)."
  - "CF, art. 144, § 2º: a polícia rodoviária federal destina-se, na forma da lei, ao patrulhamento ostensivo das rodovias federais."
  - "CTB, art. 1º, § 2º: o trânsito, em condições seguras, é um direito de todos e dever dos órgãos e entidades do Sistema Nacional de Trânsito."
  - "CTB, art. 1º, § 5º: os órgãos de trânsito darão prioridade em suas ações à defesa da vida."
  - "CTB, art. 74: a educação para o trânsito é direito de todos e dever prioritário do Sistema Nacional de Trânsito; art. 76: ela será promovida da pré-escola ao ensino superior."
  - "CTB, art. 165: dirigir sob a influência de álcool é infração gravíssima, com multa (dez vezes) e suspensão do direito de dirigir por 12 meses; a redação do caput é da Lei nº 11.705/2008, a chamada Lei Seca."
  - "CTB, art. 306: conduzir veículo com a capacidade psicomotora alterada pelo álcool ou por outra substância psicoativa é crime, com detenção de seis meses a três anos."
  - "CTB, art. 252, parágrafo único: dirigir segurando ou manuseando telefone celular é infração gravíssima."
  - "CTB, art. 280, § 2º: a infração pode ser comprovada por aparelho eletrônico ou equipamento audiovisual regulamentado pelo CONTRAN."
  - "CTB, art. 67-C: é vedado ao motorista profissional dirigir por mais de 5 horas e meia ininterruptas veículo de transporte de cargas ou coletivo de passageiros."
  - "CTB, arts. 99 e 102: só transita o veículo com peso e dimensões nos limites do CONTRAN, e o veículo de carga deve estar equipado para evitar o derramamento da carga."
  - "Desde a Lei nº 14.599/2023, o CTB fala em \"sinistro de trânsito\" (art. 20, IV, por exemplo)."

temas:
  # Os temas dos Ciclos 1 e 2 (PRF/config/cronograma.yml): um por sabado nas semanas
  # 1 a 6 e 13 a 16; nas semanas 7 a 12 a faixa repete os temas 1 a 6 (a 2a versao,
  # PRF-38), e a `data` aqui e a da 1a vez. O `tema` e IGUAL ao titulo da faixa depois
  # de "Redação da semana: ". Os `quesitos` sao os aspectos do comando, um conceito de
  # 0 a 3 cada na correcao.
  # Nos temas propostos pelo Claude, o 3o texto e curto e escrito pela IA, no estilo
  # dos fragmentos da prova (noticia, sem dica), sem numero: a banca usa noticia e
  # dado, e dado inventado nao entra (PRF-70, regra 2).
  # As semanas 1 e 2 sao as discursivas da propria PRF, 2019 e 2021, com o nome que
  # tiveram (PRF-69). O caderno oficial (textos motivadores e comando) e de terceiros e
  # fica so nesta maquina, em data/propostas_da_prf.json (fora do git); aqui, a versao
  # com outras palavras, para o clone do GitHub.
  - data: "2027-01-09"
    tema: "O combate às infrações de trânsito nas rodovias federais brasileiras"
    origem: "a discursiva da PRF de 2019 (aqui, com outras palavras; com o data/propostas_da_prf.json, a do caderno oficial)"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca das infrações de trânsito nas rodovias federais. Ao elaborar seu texto, aborde os seguintes aspectos: 1 medidas que a Polícia Rodoviária Federal adota ou pode adotar para combater as infrações; 2 ações da sociedade que auxiliem na diminuição das infrações; 3 atitudes individuais para a diminuição das infrações."
    # O valor de cada aspecto no caderno da prova (PRF-70).
    valores: [7, 6, 6]
    quesitos:
      - "2.1 Medidas da PRF no combate às infrações"
      - "2.2 Ações da sociedade para diminuir as infrações"
      - "2.3 Atitudes individuais para diminuir as infrações"
    textos:
      - texto: "A segurança pública, dever do Estado, direito e responsabilidade de todos, é exercida para a preservação da ordem pública e da incolumidade das pessoas e do patrimônio, através dos seguintes órgãos: [...] II - polícia rodoviária federal; [...] § 2º A polícia rodoviária federal, órgão permanente, organizado e mantido pela União e estruturado em carreira, destina-se, na forma da lei, ao patrulhamento ostensivo das rodovias federais."
        lei: "CF, art. 144, caput, II, e § 2º"
        url: https://www2.camara.leg.br/legin/fed/consti/1988/constituicao-1988-5-outubro-1988-322142-normaatualizada-pl.html
        acesso: 25 nov. 2026
      - texto: "O trânsito, em condições seguras, é um direito de todos e dever dos órgãos e entidades componentes do Sistema Nacional de Trânsito, a estes cabendo, no âmbito das respectivas competências, adotar as medidas destinadas a assegurar esse direito."
        lei: "Código de Trânsito Brasileiro, art. 1º, § 2º"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 25 nov. 2026

  - data: "2027-01-16"
    tema: "A inovação legislativa como instrumento para a redução dos acidentes de transporte terrestre (ATT)"
    origem: "a discursiva da PRF de 2021 (aqui, com outras palavras; com o data/propostas_da_prf.json, a do caderno oficial)"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca dos efeitos da previsão de crimes de trânsito e da Lei Seca sobre os sinistros nas rodovias. Ao elaborar seu texto, aborde os seguintes aspectos: 1 o impacto da previsão dos crimes de trânsito no Código de Trânsito Brasileiro sobre os sinistros, e as possíveis causas desse resultado; 2 o impacto da Lei Seca sobre os sinistros, e as possíveis causas desse resultado; 3 ações para reduzir os sinistros de trânsito."
    # O valor de cada aspecto no caderno da prova (PRF-70).
    valores: [5, 5, 9]
    quesitos:
      - "2.1 O impacto dos crimes de trânsito no CTB sobre os sinistros, e as causas"
      - "2.2 O impacto da Lei Seca sobre os sinistros, e as causas"
      - "2.3 Ações para reduzir os sinistros"
    textos:
      - texto: "Dirigir sob a influência de álcool ou de qualquer outra substância psicoativa que determine dependência: Infração - gravíssima; Penalidade - multa (dez vezes) e suspensão do direito de dirigir por 12 (doze) meses."
        lei: "Código de Trânsito Brasileiro, art. 165, caput (redação da Lei nº 11.705/2008, a Lei Seca)"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 25 nov. 2026
      - texto: "Conduzir veículo automotor com capacidade psicomotora alterada em razão da influência de álcool ou de outra substância psicoativa que determine dependência: Penas - detenção, de seis meses a três anos, multa e suspensão ou proibição de se obter a permissão ou a habilitação para dirigir veículo automotor."
        lei: "Código de Trânsito Brasileiro, art. 306, caput"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 25 nov. 2026

  - data: "2027-01-23"
    tema: "A fiscalização eletrônica de velocidade e a redução dos sinistros de trânsito"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca da fiscalização eletrônica de velocidade e da redução dos sinistros de trânsito. Ao elaborar seu texto, aborde os seguintes aspectos: 1 a relação entre o excesso de velocidade e a gravidade dos sinistros; 2 a fiscalização eletrônica como instrumento de segurança viária, considerando a crítica de que ela serviria apenas para arrecadar; 3 medidas que complementam a fiscalização na redução dos sinistros."
    quesitos:
      - "2.1 Excesso de velocidade e gravidade dos sinistros"
      - "2.2 A fiscalização eletrônica como instrumento de segurança, e a crítica da arrecadação"
      - "2.3 Medidas que complementam a fiscalização"
    textos:
      - texto: "A velocidade máxima permitida para a via será indicada por meio de sinalização, obedecidas suas características técnicas e as condições de trânsito."
        lei: "Código de Trânsito Brasileiro, art. 61, caput"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 25 nov. 2026
      - texto: "A infração deverá ser comprovada por declaração da autoridade ou do agente da autoridade de trânsito, por aparelho eletrônico ou por equipamento audiovisual, reações químicas ou qualquer outro meio tecnologicamente disponível, previamente regulamentado pelo CONTRAN."
        lei: "Código de Trânsito Brasileiro, art. 280, § 2º"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 25 nov. 2026
      - texto: "Poucos equipamentos despertam tanta polêmica nas estradas quanto o radar. Para parte dos motoristas, ele existe para encher os cofres públicos; para quem estuda segurança viária, é uma forma de estar presente onde não há policial. A discussão costuma esquecer um detalhe: o motorista que freia diante do aparelho e acelera logo depois mostra que conhece o risco, mas só respeita o limite quando se sente observado."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-70)"

  - data: "2027-01-30"
    tema: "O transporte rodoviário de cargas e a segurança viária"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca do transporte rodoviário de cargas e da segurança viária. Ao elaborar seu texto, aborde os seguintes aspectos: 1 os riscos que o transporte de cargas traz para a segurança nas rodovias; 2 o papel da fiscalização da Polícia Rodoviária Federal nesse transporte; 3 as responsabilidades das empresas e dos motoristas."
    quesitos:
      - "2.1 Os riscos do transporte de cargas para a segurança nas rodovias"
      - "2.2 O papel da fiscalização da PRF"
      - "2.3 As responsabilidades das empresas e dos motoristas"
    textos:
      - texto: "Somente poderá transitar pelas vias terrestres o veículo cujo peso e dimensões atenderem aos limites estabelecidos pelo CONTRAN. [...] O veículo de carga deverá estar devidamente equipado quando transitar, de modo a evitar o derramamento da carga sobre a via."
        lei: "Código de Trânsito Brasileiro, art. 99, caput, e art. 102, caput"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 25 nov. 2026
      - texto: "É vedado ao motorista profissional dirigir por mais de 5 (cinco) horas e meia ininterruptas veículos de transporte rodoviário coletivo de passageiros ou de transporte rodoviário de cargas."
        lei: "Código de Trânsito Brasileiro, art. 67-C, caput"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 25 nov. 2026
      - texto: "Boa parte do que o país consome viaja de caminhão. Grãos, combustíveis, remédios e eletrodomésticos dividem a pista com carros de passeio e ônibus, muitas vezes em rodovias de mão dupla e sem acostamento. Por trás de cada viagem há prazos de entrega, fretes disputados e motoristas que passam dias longe de casa. Quando a pressa pesa mais que a segurança, o risco deixa de ser só de quem está ao volante."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-70)"

  - data: "2027-02-06"
    tema: "A educação para o trânsito como política pública"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca da educação para o trânsito como política pública. Ao elaborar seu texto, aborde os seguintes aspectos: 1 a educação para o trânsito como dever do Estado; 2 ações de educação nas escolas e campanhas; 3 os limites da educação sem fiscalização."
    quesitos:
      - "2.1 A educação para o trânsito como dever do Estado"
      - "2.2 Ações de educação nas escolas e campanhas"
      - "2.3 Os limites da educação sem fiscalização"
    textos:
      - texto: "A educação para o trânsito é direito de todos e constitui dever prioritário para os componentes do Sistema Nacional de Trânsito."
        lei: "Código de Trânsito Brasileiro, art. 74, caput"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 25 nov. 2026
      - texto: "A educação para o trânsito será promovida na pré-escola e nas escolas de 1º, 2º e 3º graus, por meio de planejamento e ações coordenadas entre os órgãos e entidades do Sistema Nacional de Trânsito e de Educação, da União, dos Estados, do Distrito Federal e dos Municípios, nas respectivas áreas de atuação."
        lei: "Código de Trânsito Brasileiro, art. 76, caput"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 25 nov. 2026
      - texto: "Campanhas de trânsito costumam aparecer com força nas vésperas dos feriados e sumir logo depois. Na escola, o assunto quase sempre se resume a uma palestra ocasional. Enquanto isso, as crianças aprendem no banco de trás, observando os adultos: quem avança o sinal, quem dispensa o cinto, quem dirige depois de beber. O comportamento no trânsito também se ensina, e nem sempre pelos canais oficiais."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-70)"

  - data: "2027-02-13"
    tema: "O uso do celular ao volante e a segurança nas rodovias federais"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca do uso do celular ao volante e da segurança nas rodovias federais. Ao elaborar seu texto, aborde os seguintes aspectos: 1 por que o uso do celular ao volante aumenta o risco de sinistros; 2 o que o Código de Trânsito Brasileiro prevê para essa conduta e o papel da fiscalização; 3 ações de educação e de tecnologia que podem reduzir esse comportamento."
    quesitos:
      - "2.1 Por que o celular ao volante aumenta o risco de sinistros"
      - "2.2 O que o CTB prevê e o papel da fiscalização"
      - "2.3 Ações de educação e de tecnologia para reduzir o comportamento"
    textos:
      - texto: "Dirigir o veículo: [...] V - com apenas uma das mãos, exceto quando deva fazer sinais regulamentares de braço, mudar a marcha do veículo, ou acionar equipamentos e acessórios do veículo; VI - utilizando-se de fones nos ouvidos conectados a aparelhagem sonora ou de telefone celular; Infração - média; [...] Parágrafo único. A hipótese prevista no inciso V caracterizar-se-á como infração gravíssima no caso de o condutor estar segurando ou manuseando telefone celular."
        lei: "Código de Trânsito Brasileiro, art. 252, V, VI e parágrafo único"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 25 nov. 2026
      - texto: "Os órgãos e entidades de trânsito pertencentes no Sistema Nacional de Trânsito darão prioridade em suas ações à defesa da vida, nela incluída a preservação da saúde e do meio-ambiente."
        lei: "Código de Trânsito Brasileiro, art. 1º, § 5º"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 25 nov. 2026
      - texto: "O celular entrou no carro como ferramenta de trabalho e de navegação e acabou virando distração. Responder a uma mensagem leva poucos segundos, mas, nesse intervalo, o veículo continua em movimento e o condutor deixa de olhar a pista. Nas rodovias, onde a velocidade é maior, a margem para corrigir um erro é menor. Mesmo assim, o hábito persiste, e muitos motoristas ainda tratam a mensagem ao volante como algo inofensivo."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-70)"

  # Os temas novos do Ciclo 2 (semanas 13 a 16), escritos em 26/11/2026 (PRF-38) do
  # mesmo jeito: textos literais da compilacao da Camara (fontes/leis/), conferidos pelo
  # tests/test_redacao_cebraspe.py.
  - data: "2027-04-03"
    tema: "A proteção de crianças e adolescentes nas rodovias federais"
    origem: "tema proposto pelo Claude"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca da proteção de crianças e adolescentes nas rodovias federais. Ao elaborar seu texto, aborde os seguintes aspectos: 1 os riscos a que crianças e adolescentes estão expostos nas rodovias, no transporte e fora dele; 2 o papel da Polícia Rodoviária Federal na proteção de crianças e adolescentes; 3 a responsabilidade da família e da sociedade nessa proteção."
    quesitos:
      - "2.1 Os riscos a que crianças e adolescentes estão expostos nas rodovias"
      - "2.2 O papel da PRF na proteção de crianças e adolescentes"
      - "2.3 A responsabilidade da família e da sociedade"
    textos:
      - texto: "É dever da família, da sociedade e do Estado assegurar à criança, ao adolescente e ao jovem, com absoluta prioridade, o direito à vida, à saúde, à alimentação, à educação, ao lazer, à profissionalização, à cultura, à dignidade, ao respeito, à liberdade e à convivência familiar e comunitária, além de colocá-los a salvo de toda forma de negligência, discriminação, exploração, violência, crueldade e opressão."
        lei: "CF, art. 227, caput"
        url: https://www2.camara.leg.br/legin/fed/consti/1988/constituicao-1988-5-outubro-1988-322142-normaatualizada-pl.html
        acesso: 26 nov. 2026
      - texto: "As crianças com idade inferior a 10 (dez) anos que não tenham atingido 1,45 m (um metro e quarenta e cinco centímetros) de altura devem ser transportadas nos bancos traseiros, em dispositivo de retenção adequado para cada idade, peso e altura, salvo exceções relacionadas a tipos específicos de veículos regulamentadas pelo Contran."
        lei: "Código de Trânsito Brasileiro, art. 64, caput"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 26 nov. 2026
      - texto: "Nas viagens de férias, ainda se veem crianças soltas no banco de trás, deitadas no colo de um adulto ou com a cabeça para fora da janela. A cena parece inofensiva até a primeira freada brusca. Fora dos carros, a rodovia expõe crianças e adolescentes a outros riscos: o trabalho à beira da estrada, a travessia sem passarela e, nos casos mais graves, a exploração sexual em postos e pontos de parada."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-70)"

  - data: "2027-04-10"
    tema: "A preservação do meio ambiente e o transporte nas rodovias federais"
    origem: "tema proposto pelo Claude"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca da preservação do meio ambiente no transporte pelas rodovias federais. Ao elaborar seu texto, aborde os seguintes aspectos: 1 os impactos do transporte rodoviário sobre o meio ambiente; 2 a atuação da Polícia Rodoviária Federal no combate aos crimes ambientais e na fiscalização do transporte de produtos perigosos; 3 medidas que conciliem o transporte rodoviário e a preservação ambiental."
    quesitos:
      - "2.1 Os impactos do transporte rodoviário sobre o meio ambiente"
      - "2.2 A atuação da PRF contra os crimes ambientais e no transporte de produtos perigosos"
      - "2.3 Medidas que conciliem o transporte e a preservação"
    textos:
      - texto: "Todos têm direito ao meio ambiente ecologicamente equilibrado, bem de uso comum do povo e essencial à sadia qualidade de vida, impondo-se ao poder público e à coletividade o dever de defendê-lo e preservá-lo para as presentes e futuras gerações."
        lei: "CF, art. 225, caput"
        url: https://www2.camara.leg.br/legin/fed/consti/1988/constituicao-1988-5-outubro-1988-322142-normaatualizada-pl.html
        acesso: 26 nov. 2026
      - texto: "Os órgãos e entidades de trânsito [...] darão prioridade em suas ações à defesa da vida, nela incluída a preservação da saúde e do meio-ambiente."
        lei: "Código de Trânsito Brasileiro, art. 1º, § 5º"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 26 nov. 2026
      - texto: "As rodovias que cortam o país também atravessam florestas, rios e áreas de proteção. Por elas passam caminhões com madeira, animais silvestres capturados e produtos químicos que, num acidente, podem contaminar o solo e a água. Ao mesmo tempo, a estrada leva desenvolvimento a regiões isoladas. O desafio é fazer a carga chegar ao destino sem deixar pelo caminho um rastro de destruição."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-70)"

  - data: "2027-04-17"
    tema: "Os direitos humanos e a atuação da Polícia Rodoviária Federal"
    origem: "tema proposto pelo Claude"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca dos direitos humanos na atuação da Polícia Rodoviária Federal. Ao elaborar seu texto, aborde os seguintes aspectos: 1 a importância do respeito aos direitos humanos na atividade policial; 2 os limites legais da abordagem e do uso da força pelo policial rodoviário federal; 3 a relação entre o respeito aos direitos e a confiança da sociedade na polícia."
    quesitos:
      - "2.1 A importância dos direitos humanos na atividade policial"
      - "2.2 Os limites legais da abordagem e do uso da força"
      - "2.3 O respeito aos direitos e a confiança da sociedade na polícia"
    textos:
      - texto: "A República Federativa do Brasil, formada pela união indissolúvel dos Estados e Municípios e do Distrito Federal, constitui-se em Estado democrático de direito e tem como fundamentos: [...] III - a dignidade da pessoa humana;"
        lei: "CF, art. 1º, caput e III"
        url: https://www2.camara.leg.br/legin/fed/consti/1988/constituicao-1988-5-outubro-1988-322142-normaatualizada-pl.html
        acesso: 26 nov. 2026
      - texto: "Todos são iguais perante a lei, sem distinção de qualquer natureza, garantindo-se aos brasileiros e aos estrangeiros residentes no País a inviolabilidade do direito à vida, à liberdade, à igualdade, à segurança e à propriedade, nos termos seguintes: [...] III - ninguém será submetido a tortura nem a tratamento desumano ou degradante;"
        lei: "CF, art. 5º, caput e III"
        url: https://www2.camara.leg.br/legin/fed/consti/1988/constituicao-1988-5-outubro-1988-322142-normaatualizada-pl.html
        acesso: 26 nov. 2026
      - texto: "Para muita gente, o único contato com o Estado durante uma viagem é a abordagem de um policial rodoviário. Em poucos minutos, aquela conversa à beira da estrada pode reforçar a confiança na instituição ou abalá-la. O cidadão espera firmeza diante do crime, mas também respeito, explicação e tratamento igual, seja qual for a aparência, a origem ou o veículo de quem é parado."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-70)"

  - data: "2027-04-24"
    tema: "Pedestres, ciclistas e motociclistas: os mais vulneráveis nas rodovias"
    origem: "tema proposto pelo Claude"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca da segurança de pedestres, ciclistas e motociclistas nas rodovias federais. Ao elaborar seu texto, aborde os seguintes aspectos: 1 os motivos que tornam pedestres, ciclistas e motociclistas os usuários mais expostos nas rodovias; 2 a responsabilidade dos condutores de veículos maiores pela segurança dos menores e dos pedestres; 3 ações de fiscalização e de educação para proteger esses usuários."
    quesitos:
      - "2.1 Por que pedestres, ciclistas e motociclistas são os mais expostos"
      - "2.2 A responsabilidade dos veículos maiores pela segurança dos menores"
      - "2.3 Ações de fiscalização e de educação"
    textos:
      - texto: "Respeitadas as normas de circulação e conduta estabelecidas neste artigo, em ordem decrescente, os veículos de maior porte serão sempre responsáveis pela segurança dos menores, os motorizados pelos não motorizados e, juntos, pela incolumidade dos pedestres."
        lei: "Código de Trânsito Brasileiro, art. 29, § 2º"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 26 nov. 2026
      - texto: "Os condutores de motocicletas, motonetas e ciclomotores só poderão circular nas vias: I - utilizando capacete de segurança, com viseira ou óculos protetores; II - segurando o guidom com as duas mãos; III - usando vestuário de proteção, de acordo com as especificações do CONTRAN."
        lei: "Código de Trânsito Brasileiro, art. 54"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 26 nov. 2026
      - texto: "Na rodovia que atravessa uma pequena cidade, o pedestre que volta do trabalho, o ciclista que segue para a lavoura e o motociclista que leva a família dividem o asfalto com carretas e ônibus. Para eles, não há lataria nem air bag: um descuido de quem conduz um veículo maior pode ser fatal. Muitas vezes, a estrada foi feita para ligar cidades, e não para quem vive à beira dela."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-70)"

  # Os 20 temas novos (PRF-71), escritos em 27/11/2026 depois do aval do Gabriel:
  # 14 de transito e 6 das outras atribuicoes da PRF, um por sabado depois do Ciclo 2
  # (de 1/5 a 11/9/2027; o cronograma ainda acaba na semana 16, e a aba acha o tema
  # pela data). Os textos de lei sao literais das compilacoes da Camara (fontes/leis/ e
  # leis/), conferidos pelo tests/test_redacao_cebraspe.py; o 3o texto e o curto da IA.
  - data: "2027-05-01"
    tema: "O sono e a fadiga ao volante como causa de sinistros nas rodovias federais"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca do sono e da fadiga ao volante nas rodovias federais. Ao elaborar seu texto, aborde os seguintes aspectos: 1 por que o sono e a fadiga aumentam o risco de sinistros; 2 os fatores que levam condutores a dirigir cansados; 3 medidas do poder público, das empresas e dos próprios condutores para enfrentar o problema."
    quesitos:
      - "2.1 Por que o sono e a fadiga aumentam o risco de sinistros"
      - "2.2 Os fatores que levam o condutor a dirigir cansado"
      - "2.3 Medidas do poder público, das empresas e dos condutores"
    textos:
      - texto: "Os usuários das vias terrestres devem: I - abster-se de todo ato que possa constituir perigo ou obstáculo para o trânsito de veículos, de pessoas ou de animais, ou ainda causar danos a propriedades públicas ou privadas;"
        lei: "Código de Trânsito Brasileiro, art. 26, I"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Dirigir sem atenção ou sem os cuidados indispensáveis à segurança: Infração - leve; Penalidade - multa."
        lei: "Código de Trânsito Brasileiro, art. 169"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Quem viaja de madrugada conhece a cena: o motorista abre a janela, aumenta o volume do rádio e promete parar no próximo posto, que sempre parece estar um pouco mais adiante. O cansaço chega devagar e engana quem está ao volante, porque o corpo apaga por instantes sem pedir licença. Na reta longa e monótona de uma rodovia, esses instantes bastam para o carro invadir a contramão ou deixar a pista."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-71)"

  - data: "2027-05-08"
    tema: "O controle do tempo de direção do motorista profissional como instrumento de segurança viária"
    origem: "tema proposto pelo Claude, no formato do Cebraspe (o desenho da prova de 2021: o impacto e as causas)"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca das regras de tempo de direção e de descanso do motorista profissional e da segurança nas rodovias. Ao elaborar seu texto, aborde os seguintes aspectos: 1 o impacto das regras de tempo de direção e de descanso sobre os sinistros com veículos de carga e de passageiros e as possíveis causas desse impacto; 2 os obstáculos ao cumprimento dessas regras; 3 ações para garantir o descanso do motorista profissional."
    quesitos:
      - "2.1 O impacto das regras de direção e de descanso sobre os sinistros, e as causas"
      - "2.2 Os obstáculos ao cumprimento das regras"
      - "2.3 Ações para garantir o descanso do motorista profissional"
    textos:
      - texto: "Serão observados 30 (trinta) minutos para descanso dentro de cada 6 (seis) horas na condução de veículo de transporte de carga, sendo facultado o seu fracionamento e o do tempo de direção desde que não ultrapassadas 5 (cinco) horas e meia contínuas no exercício da condução."
        lei: "Código de Trânsito Brasileiro, art. 67-C, § 1º"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "O motorista profissional é responsável por controlar e registrar o tempo de condução estipulado no art. 67-C, com vistas à sua estrita observância. [...] O tempo de direção será controlado mediante registrador instantâneo inalterável de velocidade e tempo e, ou por meio de anotação em diário de bordo, ou papeleta ou ficha de trabalho externo, ou por meios eletrônicos instalados no veículo, conforme norma do Contran."
        lei: "Código de Trânsito Brasileiro, art. 67-E, caput e § 2º"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Nos pátios dos postos à beira da estrada, os caminhões se enfileiram ao anoitecer, e nem todos os motoristas encontram vaga. Há quem estacione no acostamento e quem desista de parar. Para muitos, cada hora de descanso é uma hora a menos de frete, e o relógio da entrega não espera. A regra que limita o tempo ao volante está no papel, mas cumpri-la depende de mais do que a vontade de quem dirige."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-71)"

  - data: "2027-05-15"
    tema: "O tráfico de drogas e de armas pelas rodovias federais e a integração das forças de segurança"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca do tráfico de drogas e de armas pelas rodovias federais. Ao elaborar seu texto, aborde os seguintes aspectos: 1 por que as rodovias federais são usadas como rota pelo tráfico; 2 a atuação da Polícia Rodoviária Federal no enfrentamento desse crime; 3 a importância da integração entre os órgãos de segurança pública."
    quesitos:
      - "2.1 Por que as rodovias federais servem de rota ao tráfico"
      - "2.2 A atuação da PRF contra o tráfico"
      - "2.3 A integração entre os órgãos de segurança pública"
    textos:
      - texto: "Importar, exportar, remeter, preparar, produzir, fabricar, adquirir, vender, expor à venda, oferecer, ter em depósito, transportar, trazer consigo, guardar, prescrever, ministrar, entregar a consumo ou fornecer drogas, ainda que gratuitamente, sem autorização ou em desacordo com determinação legal ou regulamentar: [...]"
        lei: "Lei nº 11.343/2006 (Lei de Drogas), art. 33, caput"
        url: https://www2.camara.leg.br/legin/fed/lei/2006/lei-11343-23-agosto-2006-545399-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Compete à União estabelecer a Política Nacional de Segurança Pública e Defesa Social (PNSPDS) e aos Estados, ao Distrito Federal e aos Municípios estabelecer suas respectivas políticas, observadas as diretrizes da política nacional, especialmente para análise e enfrentamento dos riscos à harmonia da convivência social, com destaque às situações de emergência e aos crimes interestaduais e transnacionais."
        lei: "Lei nº 13.675/2018 (Susp), art. 3º"
        url: https://www2.camara.leg.br/legin/fed/lei/2018/lei-13675-11-junho-2018-786843-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Escondida entre sacos de grãos, no fundo falso de um ônibus de turismo ou no tanque adaptado de um carro comum, a carga ilícita percorre milhares de quilômetros sem chamar atenção. A rodovia que leva o alimento à mesa e o turista à praia também serve a quem lucra com a droga e a arma que abastecem a violência nas cidades. Do outro lado, o policial precisa distinguir, em poucos minutos, o viajante comum do transportador do crime."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-71)"

  - data: "2027-05-22"
    tema: "As ultrapassagens proibidas e as colisões frontais nas rodovias de pista simples"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca das ultrapassagens proibidas e das colisões frontais nas rodovias de pista simples. Ao elaborar seu texto, aborde os seguintes aspectos: 1 por que a ultrapassagem indevida está entre as manobras mais perigosas nas rodovias de pista simples; 2 os fatores que levam o condutor a arriscar a ultrapassagem; 3 ações de fiscalização, de engenharia e de educação para reduzir esse tipo de sinistro."
    quesitos:
      - "2.1 Por que a ultrapassagem indevida é tão perigosa na pista simples"
      - "2.2 Os fatores que levam o condutor a arriscar"
      - "2.3 Ações de fiscalização, de engenharia e de educação"
    textos:
      - texto: "X - todo condutor deverá, antes de efetuar uma ultrapassagem, certificar-se de que: a) nenhum condutor que venha atrás haja começado uma manobra para ultrapassá-lo; b) quem o precede na mesma faixa de trânsito não haja indicado o propósito de ultrapassar um terceiro; c) a faixa de trânsito que vai tomar esteja livre numa extensão suficiente para que sua manobra não ponha em perigo ou obstrua o trânsito que venha em sentido contrário."
        lei: "Código de Trânsito Brasileiro, art. 29, X"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Ultrapassar pela contramão outro veículo: I - nas curvas, aclives e declives, sem visibilidade suficiente; II - nas faixas de pedestre; III - nas pontes, viadutos ou túneis; [...] Infração - gravíssima; Penalidade - multa (cinco vezes)."
        lei: "Código de Trânsito Brasileiro, art. 203, I a III"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Atrás de uma carreta carregada, na subida de uma serra, a fila de carros cresce a cada curva. Um motorista impaciente sai para a esquerda, mesmo sem enxergar o que vem do outro lado. Às vezes dá certo, e ele segue convencido de que sabe o que faz. Quando não dá, o encontro é de frente, com a soma das velocidades dos dois veículos, e poucos sobrevivem para contar como foi."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-71)"

  - data: "2027-05-29"
    tema: "O socorro às vítimas de sinistros de trânsito: o Estado, a sociedade e o indivíduo"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca do socorro às vítimas de sinistros de trânsito nas rodovias federais. Ao elaborar seu texto, aborde os seguintes aspectos: 1 a importância do atendimento rápido e adequado às vítimas; 2 o papel da Polícia Rodoviária Federal e dos serviços públicos de emergência; 3 os deveres e as atitudes esperadas do condutor e das demais pessoas que presenciam o sinistro."
    quesitos:
      - "2.1 A importância do atendimento rápido e adequado"
      - "2.2 O papel da PRF e dos serviços de emergência"
      - "2.3 Os deveres do condutor e de quem presencia o sinistro"
    textos:
      - texto: "Deixar o condutor do veículo, na ocasião do sinistro, de prestar imediato socorro à vítima, ou, não podendo fazê-lo diretamente, por justa causa, deixar de solicitar auxílio da autoridade pública: Penas - detenção, de seis meses a um ano, ou multa, se o fato não constituir elemento de crime mais grave. Parágrafo único. Incide nas penas previstas neste artigo o condutor do veículo, ainda que a sua omissão seja suprida por terceiros ou que se trate de vítima com morte instantânea ou com ferimentos leves."
        lei: "Código de Trânsito Brasileiro, art. 304"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "IV - efetuar levantamento dos locais de sinistros de trânsito e dos serviços de atendimento, socorro e salvamento de vítimas;"
        lei: "Código de Trânsito Brasileiro, art. 20, IV (competência da Polícia Rodoviária Federal)"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Depois do estrondo, vem um silêncio estranho. Alguns carros diminuem a velocidade, outros param no acostamento, e logo surgem celulares filmando a cena. Poucos sabem o que fazer: há quem tente tirar a vítima do veículo, há quem ofereça água, há quem simplesmente vá embora. Enquanto o resgate não chega, os minutos que separam o sinistro do primeiro atendimento podem decidir quem sobrevive."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-71)"

  - data: "2027-06-05"
    tema: "O contrabando e o descaminho nas rodovias federais de fronteira"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca do contrabando e do descaminho nas rodovias federais, especialmente nas regiões de fronteira. Ao elaborar seu texto, aborde os seguintes aspectos: 1 os prejuízos que o contrabando e o descaminho causam ao país; 2 a atuação da Polícia Rodoviária Federal na repressão a esses crimes; 3 medidas, além da repressão policial, que podem reduzir esses crimes."
    quesitos:
      - "2.1 Os prejuízos do contrabando e do descaminho ao país"
      - "2.2 A atuação da PRF na repressão"
      - "2.3 Medidas além da repressão policial"
    textos:
      - texto: "Iludir, no todo ou em parte, o pagamento de direito ou imposto devido pela entrada, pela saída ou pelo consumo de mercadoria: [...]"
        lei: "Código Penal, art. 334, caput (descaminho)"
        url: https://www2.camara.leg.br/legin/fed/declei/1940-1949/decreto-lei-2848-7-dezembro-1940-412868-normaatualizada-pe.html
        acesso: 27 nov. 2026
      - texto: "Importar ou exportar mercadoria proibida: [...] II - importa ou exporta clandestinamente mercadoria que dependa de registro, análise ou autorização de órgão público competente;"
        lei: "Código Penal, art. 334-A, caput e § 1º, II (contrabando)"
        url: https://www2.camara.leg.br/legin/fed/declei/1940-1949/decreto-lei-2848-7-dezembro-1940-412868-normaatualizada-pe.html
        acesso: 27 nov. 2026
      - texto: "Cigarros, eletrônicos, agrotóxicos e remédios atravessam a fronteira em porta-malas, ônibus de compras e caminhões com notas frias. Do lado de cá, o produto chega mais barato e conquista o consumidor, que raramente pensa de onde ele veio. Quem perde é o comerciante que paga impostos, o trabalhador da indústria nacional e, muitas vezes, a saúde de quem consome uma mercadoria que nenhum órgão fiscalizou."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-71)"

  - data: "2027-06-12"
    tema: "O exame toxicológico dos motoristas profissionais e a segurança nas rodovias"
    origem: "tema proposto pelo Claude, no formato do Cebraspe (o desenho da prova de 2021: o impacto e as causas)"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca da exigência do exame toxicológico para os condutores das categorias C, D e E. Ao elaborar seu texto, aborde os seguintes aspectos: 1 o impacto da exigência do exame toxicológico sobre a segurança nas rodovias e as possíveis causas desse impacto; 2 os limites do exame como instrumento de prevenção; 3 ações complementares para enfrentar o uso de substâncias psicoativas pelos motoristas profissionais."
    quesitos:
      - "2.1 O impacto do exame toxicológico sobre a segurança, e as causas"
      - "2.2 Os limites do exame como instrumento de prevenção"
      - "2.3 Ações complementares contra o uso de substâncias psicoativas"
    textos:
      - texto: "Os condutores das categorias C, D e E deverão comprovar resultado negativo em exame toxicológico para a obtenção e a renovação da Carteira Nacional de Habilitação. § 1º O exame de que trata este artigo buscará aferir o consumo de substâncias psicoativas que, comprovadamente, comprometam a capacidade de direção e deverá ter janela de detecção mínima de 90 (noventa) dias, nos termos das normas do Contran."
        lei: "Código de Trânsito Brasileiro, art. 148-A, caput e § 1º"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Dirigir veículo sem realizar o exame toxicológico previsto no art. 148-A deste Código: Infração - gravíssima; Penalidade - multa (cinco vezes) e, em caso de reincidência no período de até 12 (doze) meses, multa (dez vezes) e suspensão do direito de dirigir."
        lei: "Código de Trânsito Brasileiro, art. 165-B, caput"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Para quem passa noites seguidas na estrada, a promessa de ficar acordado por mais algumas horas pode parecer uma solução. Os chamados rebites circulam há muito tempo entre parte dos caminhoneiros, ao lado de outras substâncias que escondem o cansaço sem eliminá-lo. O efeito passa, o sono volta de uma vez, e a carreta continua em movimento. A exigência de exame para os motoristas profissionais tenta responder a esse cenário e ainda divide opiniões."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-71)"

  - data: "2027-06-19"
    tema: "Os rachas e as manobras perigosas no trânsito e a resposta do Estado"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca dos rachas e das manobras perigosas nas vias públicas. Ao elaborar seu texto, aborde os seguintes aspectos: 1 os riscos que os rachas e as manobras perigosas trazem para quem participa e para terceiros; 2 a resposta administrativa e penal prevista no Código de Trânsito Brasileiro e os seus limites; 3 ações de prevenção que vão além da punição."
    quesitos:
      - "2.1 Os riscos dos rachas e das manobras perigosas"
      - "2.2 A resposta administrativa e penal do CTB, e os seus limites"
      - "2.3 Ações de prevenção além da punição"
    textos:
      - texto: "Participar, na direção de veículo automotor, em via pública, de corrida, disputa ou competição automobilística ou ainda de exibição ou demonstração de perícia em manobra de veículo automotor, não autorizada pela autoridade competente, gerando situação de risco à incolumidade pública ou privada: Penas - detenção, de 6 (seis) meses a 3 (três) anos, multa e suspensão ou proibição de se obter a permissão ou a habilitação para dirigir veículo automotor."
        lei: "Código de Trânsito Brasileiro, art. 308, caput"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Utilizar-se de veículo para demonstrar ou exibir manobra perigosa, mediante arrancada brusca, derrapagem ou frenagem com deslizamento ou arrastamento de pneus: Infração - gravíssima; [...]"
        lei: "Código de Trânsito Brasileiro, art. 175"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Basta uma reta pouco movimentada, uma noite de fim de semana e uma plateia com celulares para que a via pública vire pista de corrida. Motores roncam, pneus cantam e os vídeos rodam pelas redes sociais, onde ganham curtidas e seguidores. Quem assiste à beira da pista raramente pensa que está no lugar mais perigoso, e quem acelera quase nunca imagina que a disputa pode terminar num poste ou num carro que voltava para casa."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-71)"

  - data: "2027-06-26"
    tema: "O tráfico de pessoas e a exploração sexual de crianças e adolescentes nas rodovias federais"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca do enfrentamento ao tráfico de pessoas e à exploração sexual de crianças e adolescentes nas rodovias federais. Ao elaborar seu texto, aborde os seguintes aspectos: 1 os fatores que tornam as rodovias espaços favoráveis a esses crimes; 2 a atuação da Polícia Rodoviária Federal na identificação e no resgate das vítimas; 3 o papel da sociedade e da rede de proteção no enfrentamento desses crimes."
    quesitos:
      - "2.1 Por que as rodovias favorecem esses crimes"
      - "2.2 A atuação da PRF na identificação e no resgate das vítimas"
      - "2.3 O papel da sociedade e da rede de proteção"
    textos:
      - texto: "Agenciar, aliciar, recrutar, transportar, transferir, comprar, alojar ou acolher pessoa, mediante grave ameaça, violência, coação, fraude ou abuso, com a finalidade de: I - remover-lhe órgãos, tecidos ou partes do corpo; II - submetê-la a trabalho em condições análogas à de escravo; III - submetê-la a qualquer tipo de servidão; IV - adoção ilegal; ou V - exploração sexual."
        lei: "Código Penal, art. 149-A, caput (tráfico de pessoas)"
        url: https://www2.camara.leg.br/legin/fed/declei/1940-1949/decreto-lei-2848-7-dezembro-1940-412868-normaatualizada-pe.html
        acesso: 27 nov. 2026
      - texto: "Submeter criança ou adolescente, como tais definidos no caput do art. 2º desta Lei, à exploração sexual, se o fato não constituir crime mais grave: [...]"
        lei: "Estatuto da Criança e do Adolescente (Lei nº 8.069/1990), art. 244-A, caput"
        url: https://www2.camara.leg.br/legin/fed/lei/1990/lei-8069-13-julho-1990-372211-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Num posto de combustível afastado da cidade, uma menina circula entre os caminhões estacionados, oferecendo balas a quem desce para jantar. Em outro ponto da mesma rodovia, uma jovem embarca num ônibus com a promessa de um emprego bem pago longe de casa, sem saber quem a espera na chegada. As duas histórias parecem distantes, mas têm em comum a estrada, a pobreza e alguém disposto a lucrar com a vulnerabilidade alheia."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-71)"

  - data: "2027-07-03"
    tema: "Os animais soltos nas rodovias federais e a segurança viária"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca dos animais soltos nas rodovias federais. Ao elaborar seu texto, aborde os seguintes aspectos: 1 os riscos que os animais soltos representam para a segurança dos usuários das rodovias; 2 a responsabilidade dos proprietários dos animais e do poder público; 3 medidas de prevenção e de fiscalização para reduzir esses sinistros."
    quesitos:
      - "2.1 Os riscos dos animais soltos para os usuários"
      - "2.2 A responsabilidade dos proprietários e do poder público"
      - "2.3 Medidas de prevenção e de fiscalização"
    textos:
      - texto: "X - recolhimento de animais que se encontrem soltos nas vias e na faixa de domínio das vias de circulação, restituindo-os aos seus proprietários, após o pagamento de multas e encargos devidos."
        lei: "Código de Trânsito Brasileiro, art. 269, X (medidas administrativas)"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Os órgãos e entidades componentes do Sistema Nacional de Trânsito respondem, no âmbito das respectivas competências, objetivamente, por danos causados aos cidadãos em virtude de ação, omissão ou erro na execução e manutenção de programas, projetos e serviços que garantam o exercício do direito do trânsito seguro."
        lei: "Código de Trânsito Brasileiro, art. 1º, § 3º"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Na escuridão de uma rodovia sem iluminação, o vulto aparece de repente no meio da pista. Pode ser um cavalo que escapou do pasto, um boi que atravessou a cerca quebrada ou um cachorro abandonado. O motorista tem pouco tempo para frear ou desviar, e qualquer das escolhas pode terminar mal. No dia seguinte, a discussão é sempre a mesma: de quem era o animal, e por que ele estava ali?"
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-71)"

  - data: "2027-07-10"
    tema: "A infraestrutura das rodovias e a responsabilidade do poder público pela segurança viária"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca da infraestrutura das rodovias federais e da segurança viária. Ao elaborar seu texto, aborde os seguintes aspectos: 1 a influência das condições da via, como pavimento, sinalização e traçado, na ocorrência de sinistros; 2 a responsabilidade do poder público pela segurança das rodovias; 3 a relação entre a infraestrutura e o comportamento dos condutores na prevenção de sinistros."
    quesitos:
      - "2.1 A influência das condições da via nos sinistros"
      - "2.2 A responsabilidade do poder público"
      - "2.3 A infraestrutura e o comportamento dos condutores"
    textos:
      - texto: "Nenhuma via pavimentada poderá ser entregue após sua construção, ou reaberta ao trânsito após a realização de obras ou de manutenção, enquanto não estiver devidamente sinalizada, vertical e horizontalmente, de forma a garantir as condições adequadas de segurança na circulação."
        lei: "Código de Trânsito Brasileiro, art. 88, caput"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "O órgão ou entidade de trânsito com circunscrição sobre a via é responsável pela implantação da sinalização, respondendo pela sua falta, insuficiência ou incorreta colocação."
        lei: "Código de Trânsito Brasileiro, art. 90, § 1º"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Buracos que reaparecem a cada chuva, faixas apagadas, acostamentos que somem de repente e curvas sem aviso fazem parte da rotina de quem percorre muitas rodovias do país. O motorista aprende a desviar, a reduzir no susto e a confiar mais na memória do que na placa. Quando o sinistro acontece, a culpa costuma recair sobre quem estava ao volante, e raramente se pergunta se a estrada fez a sua parte."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-71)"

  - data: "2027-07-17"
    tema: "O roubo de cargas e de veículos nas rodovias federais"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca do roubo de cargas e de veículos nas rodovias federais. Ao elaborar seu texto, aborde os seguintes aspectos: 1 os impactos desses crimes para os motoristas, para a economia e para a sociedade; 2 a atuação da Polícia Rodoviária Federal na prevenção e na repressão; 3 o papel da receptação e as medidas para combatê-la."
    quesitos:
      - "2.1 Os impactos do roubo de cargas e de veículos"
      - "2.2 A atuação da PRF na prevenção e na repressão"
      - "2.3 A receptação e as medidas para combatê-la"
    textos:
      - texto: "Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência: [...]"
        lei: "Código Penal, art. 157, caput (roubo)"
        url: https://www2.camara.leg.br/legin/fed/declei/1940-1949/decreto-lei-2848-7-dezembro-1940-412868-normaatualizada-pe.html
        acesso: 27 nov. 2026
      - texto: "Adquirir, receber, transportar, conduzir ou ocultar, em proveito próprio ou alheio, coisa que sabe ser produto de crime, ou influir para que terceiro, de boa-fé, a adquira, receba ou oculte: [...]"
        lei: "Código Penal, art. 180, caput (receptação)"
        url: https://www2.camara.leg.br/legin/fed/declei/1940-1949/decreto-lei-2848-7-dezembro-1940-412868-normaatualizada-pe.html
        acesso: 27 nov. 2026
      - texto: "O caminhoneiro para num trecho deserto para conferir um pneu e, em segundos, está rendido. A carga de eletrônicos, de remédios ou de alimentos troca de caminhão antes do amanhecer e, dias depois, reaparece à venda em lojas e feiras, por um preço que ninguém questiona. Para o motorista, fica o medo de voltar à estrada; para quem comprou, a ilusão de ter feito um bom negócio."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-71)"

  - data: "2027-07-24"
    tema: "A exigência do farol aceso durante o dia nas rodovias e a prevenção de sinistros"
    origem: "tema proposto pelo Claude, no formato do Cebraspe (o desenho da prova de 2021: o impacto e as causas)"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca da exigência de farol aceso durante o dia nas rodovias. Ao elaborar seu texto, aborde os seguintes aspectos: 1 o impacto da exigência do farol aceso durante o dia sobre os sinistros nas rodovias de pista simples e as possíveis causas desse impacto; 2 as dificuldades de compreensão e de fiscalização da regra; 3 outras ações para aumentar a visibilidade dos veículos e a segurança nas rodovias de pista simples."
    quesitos:
      - "2.1 O impacto do farol aceso de dia sobre os sinistros, e as causas"
      - "2.2 As dificuldades de compreensão e de fiscalização da regra"
      - "2.3 Outras ações para a visibilidade e a segurança"
    textos:
      - texto: "Os veículos que não dispuserem de luzes de rodagem diurna deverão manter acesos os faróis nas rodovias de pista simples situadas fora dos perímetros urbanos, mesmo durante o dia."
        lei: "Código de Trânsito Brasileiro, art. 40, § 2º"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Quando o veículo estiver em movimento: I - deixar de manter acesa a luz baixa: a) durante a noite; b) de dia, em túneis e sob chuva, neblina ou cerração; [...] e) de dia, em rodovias de pista simples situadas fora dos perímetros urbanos, no caso de veículos desprovidos de luzes de rodagem diurna; [...] Infração - média; Penalidade - multa."
        lei: "Código de Trânsito Brasileiro, art. 250, I, a, b e e"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 27 nov. 2026
      - texto: "Em pleno sol do meio-dia, um carro prata se confunde com o asfalto e com a paisagem ao fundo. Para quem vem no sentido contrário e pensa em ultrapassar, esse veículo quase invisível pode ser percebido tarde demais. O farol aceso não ilumina a pista durante o dia, mas faz o veículo ser visto de longe. A regra que obriga o uso já mudou e ainda confunde muitos motoristas."
        tipo: ia
        fonte: "Texto escrito pela IA (Claude Code, claude-opus-5-5) em 27/11/2026, no estilo dos fragmentos da prova, sem dado estatístico (PRF-71)"

  - data: "2027-07-31"
    tema: "O transporte de produtos perigosos nas rodovias federais e o risco às comunidades"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que os textos acima têm caráter unicamente motivador, redija um texto dissertativo acerca do transporte rodoviário de produtos perigosos. Ao elaborar seu texto, aborde os seguintes aspectos: 1 os riscos que o transporte de produtos perigosos representa para as pessoas e para o meio ambiente; 2 o papel da fiscalização da Polícia Rodoviária Federal nesse transporte; 3 as responsabilidades das empresas e dos motoristas e a preparação para emergências."
    quesitos:
