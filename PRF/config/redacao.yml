# A redacao da PRF: o que o Cebraspe cobra, o metodo, os temas e o pedido de correcao
# para a IA. Lido pela aba Redacao do radar (o formato e o da copia PMSC, decisao
# PMSC-5). E DADO: pode editar a mao.
#
# PROCEDENCIA: escrito pelo Claude Code (claude-opus-5-5) em 25/11/2026 (PRF-37), a
# partir do item 10 do Edital PRF nº 1, de 18/1/2021 (`docs/edital.md`) e dos padroes
# de resposta definitivos das discursivas de 2019 e 2021 (links em `temas_anteriores`).
# Os textos motivadores e o repertorio sao trechos LITERAIS da lei vigente, da
# compilacao da Camara (copias em fontes/leis/), com "[...]" onde se cortou, conferidos
# palavra por palavra em 25/11/2026. Texto de lei nao tem direito autoral (Lei
# 9.610/1998, art. 8º, IV). O texto das provas (comando e textos motivadores) e de
# terceiros e NAO esta aqui: os temas de 2019 e 2021 vao com outras palavras.
#
# A NOTA (PRF-37): NPD = NC - 4 x (NE / TL), edital 10.6.4. O padrao de resposta da
# a escala de cada quesito (conceito 0 a 3), mas nao quanto ele vale nos 20 pontos, e
# o edital poe na NC tambem a apresentacao e a estrutura textual, sem dizer o peso.
# Por isso a NC do radar e uma ESTIMATIVA: os quesitos valem igual (20 x soma dos
# conceitos / (3 x quantos quesitos)), e a apresentacao vem comentada, sem nota.

regras_do_edital:
  cabecalho: "Policial Rodoviário Federal · Cebraspe · texto dissertativo de até 30 linhas · 20 pontos · eliminado abaixo de 10"
  tema: "Temas relacionados aos objetos de avaliação (10.1). Em 2019 e em 2021, os dois foram de trânsito nas rodovias, com três aspectos para abordar."
  tipo: dissertativo
  # Sem minimo de linhas no edital do Cebraspe: so o maximo (10.1). Com 0, nao ha
  # desconto por linha que falta.
  linhas_minimo: 0
  linhas_maximo: 30
  nota_maxima: 20
  nota_minima: 10
  # NPD = NC - 4 x (NE / TL) (10.6.4, d).
  fator_dos_erros: 4
  # A escala de cada quesito nos padroes de resposta de 2019 e 2021.
  conceito_maximo: 3
  corrigida_ate_a_posicao: "6.000"
  formula: "NPD = NC − 4 × (NE ÷ TL) (10.6.4): NC é a nota de conteúdo (apresentação, estrutura textual e desenvolvimento do tema, até 20), NE os erros de grafia, morfossintaxe e propriedade vocabular, e TL as linhas efetivamente escritas. NPD negativa vira zero; abaixo de 10, eliminado."
  item_da_formula: "edital 2021, 10.6.4"
  criterio_da_correcao: "pelo critério do Cebraspe (edital 2021, 10.6.4, e os padrões de resposta da PRF de 2019 e 2021)"
  criterios_de_conteudo:
    - "Apresentação e estrutura textual (10.6.4, a)"
    - "Desenvolvimento do tema: um quesito por aspecto da proposta, cada um com conceito de 0 a 3 (padrões de resposta de 2019 e 2021)"
  zero:
    - "Fuga ao tema (10.6.4, g)"
    - "Não haver texto (10.6.4, g)"
    - "NPD abaixo de zero vira zero (10.6.4, e)"
    - "Anulada: folha com marca que identifique o candidato fora do lugar próprio (10.4) ou não devolvida (10.6.5)"
  caneta: "caneta esferográfica de tinta preta, de material transparente (10.3)"
  ilegivel: "o edital pede letra legível (10.3)"
  sem_textos: "Os temas de 2019 e 2021 foram de trânsito nas rodovias, com três aspectos para abordar."
  fonte: "Edital Concurso PRF nº 1, de 18 de janeiro de 2021, item 10 (docs/edital.md)."

esqueleto:
  - parte: Introdução
    linhas: "3 a 5"
    o_que_escrever: "O contexto (um fato, uma situação da rodovia ou, quando for pertinente, a lei) + o tema + anuncie os três aspectos que o texto vai tratar. Varie a abertura: não comece toda redação pela lei."
    modelo: "[Um fato ou uma situação que mostre o problema]. Nesse cenário, [o tema] envolve [aspecto 1], [aspecto 2] e [aspecto 3]."
  - parte: Aspecto 1
    linhas: "6 a 8"
    o_que_escrever: "Responda ao primeiro aspecto: explique (não só cite), dê a causa ou o exemplo e ligue ao tema. É o quesito 2.1."
    modelo: "Em primeiro lugar, [aspecto 1]. Isso ocorre porque [explicação]. Um exemplo é [exemplo]. Dessa forma, [ligação com o tema]."
  - parte: Aspecto 2
    linhas: "6 a 8"
    o_que_escrever: "O mesmo desenho, com o segundo aspecto, e uma ponte com o primeiro. É o quesito 2.2."
    modelo: "Além disso, [aspecto 2], o que se relaciona com [aspecto 1] porque [ponte]. [Explicação]. [Exemplo]."
  - parte: Aspecto 3
    linhas: "6 a 8"
    o_que_escrever: "O terceiro aspecto, com exemplos concretos. Quando o aspecto pede ações, diga quem faz, o que faz e para quê. É o quesito 2.3."
    modelo: "Por fim, [aspecto 3]: cabe a [quem] [ação], por meio de [como], a fim de [para quê]."
  - parte: Conclusão
    linhas: "3 a 4"
    o_que_escrever: "Retome o tema articulando os três aspectos, sem ideia nova."
    modelo: "Portanto, [tema] depende de [aspecto 1], [aspecto 2] e [aspecto 3], que se complementam: [síntese]."

roteiro_de_ideias:
  minutos: 10
  passos:
    - "Leia o comando e numere os aspectos: cada aspecto é um quesito, e cada quesito vira um parágrafo."
    - "Para cada aspecto, responda em uma linha: O QUE é, POR QUE acontece (a causa) e UM EXEMPLO concreto."
    - "Ache a ligação entre os aspectos (o conceito 3 exige articular com o tema e com os outros aspectos)."
    - "Escreva a frase da introdução que anuncia os três aspectos. Só então comece o texto."

conectivos:
  abrir: [Em primeiro lugar, Inicialmente, Além disso, Ademais, Por fim]
  explicar: [Isso ocorre porque, Visto que, Uma vez que, Em razão de]
  exemplificar: [Um exemplo disso é, É o caso de, Como se vê em]
  contrastar: [Entretanto, Contudo, No entanto]
  fechar: [Dessa forma, Assim, Portanto, Diante disso]

erros_que_mais_tiram_ponto:
  - "Citar o aspecto sem explicar: no padrão, mencionar sem desenvolver é conceito 1."
  - "Desenvolver um aspecto solto, sem ligar ao tema e aos outros: é conceito 2."
  - "Esquecer um aspecto: conceito 0 naquele quesito."
  - "Passar de 30 linhas: o que passa é desconsiderado (10.6.4, c)."
  - "Vírgula entre sujeito e verbo."
  - "Crase antes de palavra masculina ou de verbo."
  - "\"Haviam problemas\" (o certo é \"havia\": haver no sentido de existir não vai ao plural)."
  - "\"Onde\" para o que não é lugar (use \"em que\", \"no qual\")."
  - "mas x mais; a x há; mal x mau; porque x por que."
  - "Acento: \"têm\" no plural, \"veem\" sem acento."
  - "Cada erro tira 4 ÷ TL: em 30 linhas, 6 erros tiram 0,80 ponto."

# So o que e certo, conferido no texto da lei. Numero inventado vira erro de
# conteudo: a IA nunca deve sugerir estatistica que nao esteja aqui.
repertorio:
  - "CF, art. 144, caput: a segurança pública, dever do Estado, direito e responsabilidade de todos, é exercida para a preservação da ordem pública e da incolumidade das pessoas e do patrimônio; a polícia rodoviária federal é um dos órgãos (inciso II)."
  - "CF, art. 144, § 2º: a polícia rodoviária federal destina-se, na forma da lei, ao patrulhamento ostensivo das rodovias federais."
  - "CTB, art. 1º, § 2º: o trânsito, em condições seguras, é um direito de todos e dever dos órgãos e entidades do Sistema Nacional de Trânsito."
  - "CTB, art. 1º, § 5º: os órgãos de trânsito darão prioridade em suas ações à defesa da vida."
  - "CTB, art. 74: a educação para o trânsito é direito de todos e dever prioritário do Sistema Nacional de Trânsito; art. 76: ela será promovida da pré-escola ao ensino superior."
  - "CTB, art. 165: dirigir sob a influência de álcool é infração gravíssima, com multa (dez vezes) e suspensão do direito de dirigir por 12 meses; a redação do caput é da Lei nº 11.705/2008, a chamada Lei Seca."
  - "CTB, art. 306: conduzir veículo com a capacidade psicomotora alterada pelo álcool ou por outra substância psicoativa é crime, com detenção de seis meses a três anos."
  - "CTB, art. 252, parágrafo único: dirigir segurando ou manuseando telefone celular é infração gravíssima."
  - "CTB, art. 280, § 2º: a infração pode ser comprovada por aparelho eletrônico ou equipamento audiovisual regulamentado pelo CONTRAN."
  - "CTB, art. 67-C: é vedado ao motorista profissional dirigir por mais de 5 horas e meia ininterruptas veículo de transporte de cargas ou coletivo de passageiros."
  - "CTB, arts. 99 e 102: só transita o veículo com peso e dimensões nos limites do CONTRAN, e o veículo de carga deve estar equipado para evitar o derramamento da carga."
  - "Desde a Lei nº 14.599/2023, o CTB fala em \"sinistro de trânsito\" (art. 20, IV, por exemplo)."

temas:
  # Os temas dos Ciclos 1 e 2 (PRF/config/cronograma.yml): um por sabado nas semanas
  # 1 a 6 e 13 a 16; nas semanas 7 a 12 a faixa repete os temas 1 a 6 (a 2a versao,
  # PRF-38), e a `data` aqui e a da 1a vez. O `tema` e IGUAL ao titulo da faixa depois
  # de "Redação da semana: ". Os `quesitos` sao os aspectos do comando, um conceito de
  # 0 a 3 cada na correcao.
  # Um texto motivador por tema (PRF-67, decisao do Gabriel: "o padrao da banca e 1
  # texto"); ficou o mais especifico do tema. O repertorio maior vai no texto de apoio
  # (data/textos_de_apoio.json).
  - data: "2027-01-09"
    tema: "As infrações de trânsito nas rodovias federais: o papel da PRF, da sociedade e do indivíduo"
    origem: "o tema da discursiva da PRF de 2019, com outras palavras"
    comando: "Considerando que o texto acima tem caráter unicamente motivador, redija um texto dissertativo acerca das infrações de trânsito nas rodovias federais. Ao elaborar seu texto, aborde os seguintes aspectos: 1 medidas que a Polícia Rodoviária Federal adota ou pode adotar para combater as infrações; 2 ações da sociedade que auxiliem na diminuição das infrações; 3 atitudes individuais para a diminuição das infrações."
    quesitos:
      - "2.1 Medidas da PRF no combate às infrações"
      - "2.2 Ações da sociedade para diminuir as infrações"
      - "2.3 Atitudes individuais para diminuir as infrações"
    textos:
      - texto: "A segurança pública, dever do Estado, direito e responsabilidade de todos, é exercida para a preservação da ordem pública e da incolumidade das pessoas e do patrimônio, através dos seguintes órgãos: [...] II - polícia rodoviária federal; [...] § 2º A polícia rodoviária federal, órgão permanente, organizado e mantido pela União e estruturado em carreira, destina-se, na forma da lei, ao patrulhamento ostensivo das rodovias federais."
        lei: "CF, art. 144, caput, II, e § 2º"
        url: https://www2.camara.leg.br/legin/fed/consti/1988/constituicao-1988-5-outubro-1988-322142-normaatualizada-pl.html
        acesso: 25 nov. 2026

  - data: "2027-01-16"
    tema: "O uso do celular ao volante e a segurança nas rodovias federais"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que o texto acima tem caráter unicamente motivador, redija um texto dissertativo acerca do uso do celular ao volante e da segurança nas rodovias federais. Ao elaborar seu texto, aborde os seguintes aspectos: 1 por que o uso do celular ao volante aumenta o risco de sinistros; 2 o que o Código de Trânsito Brasileiro prevê para essa conduta e o papel da fiscalização; 3 ações de educação e de tecnologia que podem reduzir esse comportamento."
    quesitos:
      - "2.1 Por que o celular ao volante aumenta o risco de sinistros"
      - "2.2 O que o CTB prevê e o papel da fiscalização"
      - "2.3 Ações de educação e de tecnologia para reduzir o comportamento"
    textos:
      - texto: "Dirigir o veículo: [...] V - com apenas uma das mãos, exceto quando deva fazer sinais regulamentares de braço, mudar a marcha do veículo, ou acionar equipamentos e acessórios do veículo; VI - utilizando-se de fones nos ouvidos conectados a aparelhagem sonora ou de telefone celular; Infração - média; [...] Parágrafo único. A hipótese prevista no inciso V caracterizar-se-á como infração gravíssima no caso de o condutor estar segurando ou manuseando telefone celular."
        lei: "Código de Trânsito Brasileiro, art. 252, V, VI e parágrafo único"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 25 nov. 2026

  - data: "2027-01-23"
    tema: "A fiscalização eletrônica de velocidade e a redução dos sinistros de trânsito"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que o texto acima tem caráter unicamente motivador, redija um texto dissertativo acerca da fiscalização eletrônica de velocidade e da redução dos sinistros de trânsito. Ao elaborar seu texto, aborde os seguintes aspectos: 1 a relação entre o excesso de velocidade e a gravidade dos sinistros; 2 a fiscalização eletrônica como instrumento de segurança viária, considerando a crítica de que ela serviria apenas para arrecadar; 3 medidas que complementam a fiscalização na redução dos sinistros."
    quesitos:
      - "2.1 Excesso de velocidade e gravidade dos sinistros"
      - "2.2 A fiscalização eletrônica como instrumento de segurança, e a crítica da arrecadação"
      - "2.3 Medidas que complementam a fiscalização"
    textos:
      - texto: "A infração deverá ser comprovada por declaração da autoridade ou do agente da autoridade de trânsito, por aparelho eletrônico ou por equipamento audiovisual, reações químicas ou qualquer outro meio tecnologicamente disponível, previamente regulamentado pelo CONTRAN."
        lei: "Código de Trânsito Brasileiro, art. 280, § 2º"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 25 nov. 2026

  - data: "2027-01-30"
    tema: "O transporte rodoviário de cargas e a segurança viária"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que o texto acima tem caráter unicamente motivador, redija um texto dissertativo acerca do transporte rodoviário de cargas e da segurança viária. Ao elaborar seu texto, aborde os seguintes aspectos: 1 os riscos que o transporte de cargas traz para a segurança nas rodovias; 2 o papel da fiscalização da Polícia Rodoviária Federal nesse transporte; 3 as responsabilidades das empresas e dos motoristas."
    quesitos:
      - "2.1 Os riscos do transporte de cargas para a segurança nas rodovias"
      - "2.2 O papel da fiscalização da PRF"
      - "2.3 As responsabilidades das empresas e dos motoristas"
    textos:
      - texto: "É vedado ao motorista profissional dirigir por mais de 5 (cinco) horas e meia ininterruptas veículos de transporte rodoviário coletivo de passageiros ou de transporte rodoviário de cargas."
        lei: "Código de Trânsito Brasileiro, art. 67-C, caput"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 25 nov. 2026

  - data: "2027-02-06"
    tema: "A educação para o trânsito como política pública"
    origem: "tema proposto pelo Claude, no formato do Cebraspe"
    comando: "Considerando que o texto acima tem caráter unicamente motivador, redija um texto dissertativo acerca da educação para o trânsito como política pública. Ao elaborar seu texto, aborde os seguintes aspectos: 1 a educação para o trânsito como dever do Estado; 2 ações de educação nas escolas e campanhas; 3 os limites da educação sem fiscalização."
    quesitos:
      - "2.1 A educação para o trânsito como dever do Estado"
      - "2.2 Ações de educação nas escolas e campanhas"
      - "2.3 Os limites da educação sem fiscalização"
    textos:
      - texto: "A educação para o trânsito é direito de todos e constitui dever prioritário para os componentes do Sistema Nacional de Trânsito."
        lei: "Código de Trânsito Brasileiro, art. 74, caput"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 25 nov. 2026

  - data: "2027-02-13"
    tema: "Os crimes de trânsito, a Lei Seca e os sinistros nas rodovias"
    origem: "o tema da discursiva da PRF de 2021, com outras palavras"
    comando: "Considerando que o texto acima tem caráter unicamente motivador, redija um texto dissertativo acerca dos efeitos da previsão de crimes de trânsito e da Lei Seca sobre os sinistros nas rodovias. Ao elaborar seu texto, aborde os seguintes aspectos: 1 o impacto da previsão dos crimes de trânsito no Código de Trânsito Brasileiro sobre os sinistros, e as possíveis causas desse resultado; 2 o impacto da Lei Seca sobre os sinistros, e as possíveis causas desse resultado; 3 ações para reduzir os sinistros de trânsito."
    quesitos:
      - "2.1 O impacto dos crimes de trânsito no CTB sobre os sinistros, e as causas"
      - "2.2 O impacto da Lei Seca sobre os sinistros, e as causas"
      - "2.3 Ações para reduzir os sinistros"
    textos:
      - texto: "Dirigir sob a influência de álcool ou de qualquer outra substância psicoativa que determine dependência: Infração - gravíssima; Penalidade - multa (dez vezes) e suspensão do direito de dirigir por 12 (doze) meses."
        lei: "Código de Trânsito Brasileiro, art. 165, caput (redação da Lei nº 11.705/2008, a Lei Seca)"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 25 nov. 2026

  # Os temas novos do Ciclo 2 (semanas 13 a 16), escritos em 26/11/2026 (PRF-38) do
  # mesmo jeito: textos literais da compilacao da Camara (fontes/leis/), conferidos pelo
  # tests/test_redacao_cebraspe.py.
  - data: "2027-04-03"
    tema: "A proteção de crianças e adolescentes nas rodovias federais"
    origem: "tema proposto pelo Claude"
    comando: "Considerando que o texto acima tem caráter unicamente motivador, redija um texto dissertativo acerca da proteção de crianças e adolescentes nas rodovias federais. Ao elaborar seu texto, aborde os seguintes aspectos: 1 os riscos a que crianças e adolescentes estão expostos nas rodovias, no transporte e fora dele; 2 o papel da Polícia Rodoviária Federal na proteção de crianças e adolescentes; 3 a responsabilidade da família e da sociedade nessa proteção."
    quesitos:
      - "2.1 Os riscos a que crianças e adolescentes estão expostos nas rodovias"
      - "2.2 O papel da PRF na proteção de crianças e adolescentes"
      - "2.3 A responsabilidade da família e da sociedade"
    textos:
      - texto: "As crianças com idade inferior a 10 (dez) anos que não tenham atingido 1,45 m (um metro e quarenta e cinco centímetros) de altura devem ser transportadas nos bancos traseiros, em dispositivo de retenção adequado para cada idade, peso e altura, salvo exceções relacionadas a tipos específicos de veículos regulamentadas pelo Contran."
        lei: "Código de Trânsito Brasileiro, art. 64, caput"
        url: https://www2.camara.leg.br/legin/fed/lei/1997/lei-9503-23-setembro-1997-372348-normaatualizada-pl.html
        acesso: 26 nov. 2026

  - data: "2027-04-10"
    tema: "A preservação do meio ambiente e o transporte nas rodovias federais"
    origem: "tema proposto pelo Claude"
    comando: "Considerando que o texto acima tem caráter unicamente motivador, redija um texto dissertativo acerca da preservação do meio ambiente no transporte pelas rodovias federais. Ao elaborar seu texto, aborde os seguintes aspectos: 1 os impactos do transporte rodoviário sobre o meio ambiente; 2 a atuação da Polícia Rodoviária Federal no combate aos crimes ambientais e na fiscalização do transporte de produtos perigosos; 3 medidas que conciliem o transporte rodoviário e a preservação ambiental."
    quesitos:
      - "2.1 Os impactos do transporte rodoviário sobre o meio ambiente"
      - "2.2 A atuação da PRF contra os crimes ambientais e no transporte de produtos perigosos"
      - "2.3 Medidas que conciliem o transporte e a preservação"
    textos:
      - texto: "Todos têm direito ao meio ambiente ecologicamente equilibrado, bem de uso comum do povo e essencial à sadia qualidade de vida, impondo-se ao poder público e à coletividade o dever de defendê-lo e preservá-lo para as presentes e futuras gerações."
        lei: "CF, art. 225, caput"
        url: https://www2.camara.leg.br/legin/fed/consti/1988/constituicao-1988-5-outubro-1988-322142-normaatualizada-pl.html
        acesso: 26 nov. 2026

  - data: "2027-04-17"
    tema: "Os direitos humanos e a atuação da Polícia Rodoviária Federal"
    origem: "tema proposto pelo Claude"
    comando: "Considerando que o texto acima tem caráter unicamente motivador, redija um texto dissertativo acerca dos direitos humanos na atuação da Polícia Rodoviária Federal. Ao elaborar seu texto, aborde os seguintes aspectos: 1 a importância do respeito aos direitos humanos na atividade policial; 2 os limites legais da abordagem e do uso da força pelo policial rodoviário federal; 3 a relação entre o respeito aos direitos e a confiança da sociedade na polícia."
    quesitos:
      - "2.1 A importância dos direitos humanos na atividade policial"
      - "2.2 Os limites legais da abordagem e do uso da força"
      - "2.3 O respeito aos direitos e a confiança da sociedade na polícia"
    textos:
      - texto: "Todos são iguais perante a lei, sem distinção de qualquer natureza, garantindo-se aos brasileiros e aos estrangeiros residentes no País a inviolabilidade do direito à vida, à liberdade, à igualdade, à segurança e à propriedade, nos termos seguintes: [...] III - ninguém será submetido a tortura nem a tratamento desumano ou degradante;"
        lei: "CF, art. 5º, caput e III"
        url: https://www2.camara.leg.br/legin/fed/consti/1988/constituicao-1988-5-outubro-1988-322142-normaatualizada-pl.html
        acesso: 26 nov. 2026

  - data: "2027-04-24"
    tema: "Pedestres, ciclistas e motociclistas: os mais vulneráveis nas rodovias"
    origem: "tema proposto pelo Claude"
    comando: "Considerando que o texto acima tem caráter unicamente motivador, redija um texto dissertativo acerca da segurança de pedestres, ciclistas e motociclistas nas rodovias federais. Ao elaborar seu texto, aborde os seguintes aspectos: 1 os motivos que tornam pedestres, ciclistas e motociclistas os usuários mais expostos nas rodovias; 2 a responsabilidade dos condutores de veículos maiores pela segurança dos menores e dos pedestres; 3 ações de fiscalização e de educação para proteger esses usuários."
    quesitos:
